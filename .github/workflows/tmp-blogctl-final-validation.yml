name: Temporary BlogCTL final validation

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - name: Check BlogCTL formatting
        working-directory: tools/blogctl
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following BlogCTL files need gofmt:"
            printf '%s\n' "$files"
            gofmt -d $files
            exit 1
          fi

      - name: Test BlogCTL
        working-directory: tools/blogctl
        run: go test ./...

      - name: Build BlogCTL
        working-directory: tools/blogctl
        run: go build -o "$RUNNER_TEMP/blogctl" ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Assemble synthetic content
        run: npm run assemble:fixtures

      - name: Test public engine
        run: npm run test:engine

      - name: Astro check
        run: npm run check

      - name: Build static site
        run: npm run build
