name: Validate engine snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-engine-snapshot.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/engine-split

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - name: Check BlogCTL formatting
        working-directory: tools/blogctl
        run: test -z "$(gofmt -l .)"

      - name: Test BlogCTL
        working-directory: tools/blogctl
        run: go test ./...

      - name: Build BlogCTL
        working-directory: tools/blogctl
        run: go build ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Assemble synthetic content
        run: npm run assemble:fixtures

      - name: Test public engine
        run: npm run test:engine

      - name: Astro check
        run: npm run check

      - name: Build static site
        run: npm run build
