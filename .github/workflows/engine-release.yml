name: Release Inkerio source
on:
  push:
    tags: ['inkerio-v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Package source with license and dependency boundaries
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          assert os.environ['GITHUB_REF_NAME'] == 'inkerio-v' + json.load(open('package.json'))['version']
          PYCODE
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          mkdir dist
          name="${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$name/" HEAD | gzip -n > "dist/$name.tar.gz"
          git archive --format=zip --prefix="$name/" HEAD > "dist/$name.zip"
          tar -tzf "dist/$name.tar.gz" | grep -Fx "$name/LICENSE"
          tar -tzf "dist/$name.tar.gz" | grep -Fx "$name/THIRD_PARTY_NOTICES.md"
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - name: Publish source snapshot independently of BlogCTL
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest=false --title "Inkerio $GITHUB_REF_NAME" --notes-file docs/engine-release.md
