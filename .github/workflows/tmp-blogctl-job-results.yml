name: Temporary BlogCTL job results

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace

      - name: Wire structured Bridge job results
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/blogctl/bridge/control.go")
          text = path.read_text()

          start = text.index("type syncJob struct {")
          end = text.index("\ntype toolField struct {", start)
          replacement = r'''type syncPlatformResult struct {
          	State   string `json:"state"`
          	Result  string `json:"result,omitempty"`
          	URL     string `json:"url,omitempty"`
          	Error   string `json:"error,omitempty"`
          	Message string `json:"message,omitempty"`
          }

          type syncJobEvent struct {
          	At       string `json:"at"`
          	Platform string `json:"platform"`
          	State    string `json:"state"`
          	Result   string `json:"result,omitempty"`
          	URL      string `json:"url,omitempty"`
          	Message  string `json:"message,omitempty"`
          }

          type syncJob struct {
          	ID         string                        `json:"id"`
          	Article    string                        `json:"article"`
          	Platforms  []string                      `json:"platforms"`
          	Results    map[string]syncPlatformResult `json:"results"`
          	Events     []syncJobEvent                `json:"events,omitempty"`
          	State      string                        `json:"state"`
          	StartedAt  string                        `json:"startedAt"`
          	FinishedAt string                        `json:"finishedAt,omitempty"`
          	Output     string                        `json:"output,omitempty"`
          	Error      string                        `json:"error,omitempty"`
          	DryRun     bool                          `json:"dryRun"`
          }
          '''.replace("          ", "")
          text = text[:start] + replacement + text[end:]

          start = text.index("func (s *Server) runSyncApplication(")
          end = text.index("func (s *Server) startSyncJob(", start)
          replacement = r'''func (s *Server) runSyncApplication(ctx context.Context, config bridgeConfig, request syncRequest, onEvent func(blogapp.SyncEvent)) (string, error) {
          	applicationConfig := blogapp.SyncConfig{
          		EngineRoot:   config.EngineRoot,
          		ContentRoot:  config.ContentRoot,
          		BridgeOrigin: "http://" + DefaultAddress,
          		BridgeToken:  s.token,
          		ToolPaths:    config.ToolPaths,
          	}
          	if configPath, err := ConfigPath(); err == nil {
          		applicationConfig.ConfigPath = configPath
          	}
          	service := blogapp.NewSyncService()
          	service.OnEvent = onEvent
          	return service.Run(ctx, applicationConfig, blogapp.SyncRequest{
          		Articles:  []string{request.Article},
          		Platforms: append([]string{}, request.Platforms...),
          		DryRun:    request.DryRun,
          		Changed:   request.Changed,
          		Draft:     request.Draft,
          	})
          }

          func applySyncEventToJob(job *syncJob, event blogapp.SyncEvent, at time.Time) {
          	if job == nil || event.Platform == "" {
          		return
          	}
          	if job.Results == nil {
          		job.Results = map[string]syncPlatformResult{}
          	}
          	result := job.Results[event.Platform]
          	result.State = event.State
          	result.Result = event.Result
          	result.URL = event.URL
          	result.Message = event.Message
          	if event.State == "failed" {
          		result.Error = event.Message
          	} else {
          		result.Error = ""
          	}
          	job.Results[event.Platform] = result
          	job.Events = append(job.Events, syncJobEvent{
          		At: at.UTC().Format(time.RFC3339), Platform: event.Platform, State: event.State,
          		Result: event.Result, URL: event.URL, Message: event.Message,
          	})
          }

          func (s *Server) recordSyncEvent(jobID string, event blogapp.SyncEvent) {
          	s.mu.Lock()
          	defer s.mu.Unlock()
          	applySyncEventToJob(s.jobs[jobID], event, s.now())
          }

          '''.replace("          ", "")
          text = text[:start] + replacement + text[end:]

          start = text.index("func (s *Server) startSyncJob(")
          replacement = r'''func (s *Server) startSyncJob(request syncRequest) *syncJob {
          	startedAt := s.now().UTC()
          	results := make(map[string]syncPlatformResult, len(request.Platforms))
          	events := make([]syncJobEvent, 0, len(request.Platforms))
          	for _, platform := range request.Platforms {
          		results[platform] = syncPlatformResult{State: "queued"}
          		events = append(events, syncJobEvent{
          			At: startedAt.Format(time.RFC3339), Platform: platform, State: "queued",
          		})
          	}
          	job := &syncJob{
          		ID: newJobID(), Article: request.Article, Platforms: append([]string{}, request.Platforms...),
          		Results: results, Events: events, State: "running",
          		StartedAt: startedAt.Format(time.RFC3339), DryRun: request.DryRun,
          	}
          	s.mu.Lock()
          	if s.jobs == nil {
          		s.jobs = map[string]*syncJob{}
          	}
          	s.jobs[job.ID] = job
          	s.jobOrder = append([]string{job.ID}, s.jobOrder...)
          	if len(s.jobOrder) > 20 {
          		for _, id := range s.jobOrder[20:] {
          			delete(s.jobs, id)
          		}
          		s.jobOrder = s.jobOrder[:20]
          	}
          	config := s.config
          	s.mu.Unlock()

          	go func() {
          		output, err := s.runSyncApplication(context.Background(), config, request, func(event blogapp.SyncEvent) {
          			s.recordSyncEvent(job.ID, event)
          		})
          		s.mu.Lock()
          		defer s.mu.Unlock()
          		stored := s.jobs[job.ID]
          		if stored == nil {
          			return
          		}
          		stored.Output = output
          		stored.FinishedAt = s.now().UTC().Format(time.RFC3339)
          		if err != nil {
          			stored.State = "failed"
          			stored.Error = err.Error()
          			for _, platform := range stored.Platforms {
          				result := stored.Results[platform]
          				if result.State == "completed" || result.State == "failed" {
          					continue
          				}
          				applySyncEventToJob(stored, blogapp.SyncEvent{
          					Platform: platform, State: "failed", Message: err.Error(),
          				}, s.now())
          			}
          			return
          		}
          		stored.State = "completed"
          	}()
          	return cloneSyncJob(job)
          }

          func cloneSyncJob(job *syncJob) *syncJob {
          	if job == nil {
          		return nil
          	}
          	clone := *job
          	clone.Platforms = append([]string{}, job.Platforms...)
          	clone.Events = append([]syncJobEvent{}, job.Events...)
          	clone.Results = make(map[string]syncPlatformResult, len(job.Results))
          	for platform, result := range job.Results {
          		clone.Results[platform] = result
          	}
          	return &clone
          }

          func (s *Server) syncJobs() []syncJob {
          	s.mu.Lock()
          	defer s.mu.Unlock()
          	result := make([]syncJob, 0, len(s.jobOrder))
          	for _, id := range s.jobOrder {
          		if job := cloneSyncJob(s.jobs[id]); job != nil {
          			result = append(result, *job)
          		}
          	}
          	return result
          }
          '''.replace("          ", "")
          text = text[:start] + replacement
          path.write_text(text)

          path = Path("tools/blogctl/bridge/server.go")
          text = path.read_text()
          old = '''\ts.mu.Lock()
          \tjob := s.jobs[id]
          \tvar copy syncJob
          \tif job != nil {
          \t\tcopy = *job
          \t}
          \ts.mu.Unlock()
          \tif job == nil {
          \t\twriteJSON(response, http.StatusNotFound, map[string]any{"error": "sync job not found"})
          \t\treturn
          \t}
          \twriteJSON(response, http.StatusOK, map[string]any{"job": copy})'''.replace("          ", "")
          new = '''\ts.mu.Lock()
          \tjob := cloneSyncJob(s.jobs[id])
          \ts.mu.Unlock()
          \tif job == nil {
          \t\twriteJSON(response, http.StatusNotFound, map[string]any{"error": "sync job not found"})
          \t\treturn
          \t}
          \twriteJSON(response, http.StatusOK, map[string]any{"job": job})'''.replace("          ", "")
          if old not in text:
              raise SystemExit("sync job GET block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Add Bridge job result tests
        shell: bash
        run: |
          cat > tools/blogctl/bridge/control_job_test.go <<'EOF'
          package bridge

          import (
          	"testing"
          	"time"

          	blogapp "github.com/ThinkerQAQ/ThinkerQAQ.github.io/tools/blogctl/app"
          )

          func TestApplySyncEventToJobUpdatesStructuredResult(t *testing.T) {
          	job := &syncJob{
          		ID: "job-1",
          		Results: map[string]syncPlatformResult{
          			"devto": {State: "queued"},
          		},
          	}
          	at := time.Date(2026, 9, 17, 12, 0, 0, 0, time.UTC)
          	applySyncEventToJob(job, blogapp.SyncEvent{
          		Platform: "devto",
          		State:    "completed",
          		Result:   "updated",
          		URL:      "https://dev.to/example",
          	}, at)

          	got := job.Results["devto"]
          	if got.State != "completed" || got.Result != "updated" || got.URL != "https://dev.to/example" {
          		t.Fatalf("result = %#v", got)
          	}
          	if len(job.Events) != 1 || job.Events[0].At != "2026-09-17T12:00:00Z" {
          		t.Fatalf("events = %#v", job.Events)
          	}
          }

          func TestCloneSyncJobDeepCopiesCollections(t *testing.T) {
          	original := &syncJob{
          		Platforms: []string{"medium"},
          		Results: map[string]syncPlatformResult{"medium": {State: "running"}},
          		Events: []syncJobEvent{{Platform: "medium", State: "running"}},
          	}
          	clone := cloneSyncJob(original)
          	clone.Platforms[0] = "devto"
          	clone.Results["medium"] = syncPlatformResult{State: "failed"}
          	clone.Events[0].State = "failed"
          	if original.Platforms[0] != "medium" || original.Results["medium"].State != "running" || original.Events[0].State != "running" {
          		t.Fatalf("original mutated: %#v", original)
          	}
          }
          EOF

      - name: Format and test Go
        working-directory: tools/blogctl
        run: |
          gofmt -w app bridge
          go test ./...

      - name: Commit structured job results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/app tools/blogctl/bridge
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: expose structured sync platform results"
          git push origin HEAD:refactor/blogctl-content-workspace
