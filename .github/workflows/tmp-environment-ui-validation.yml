name: Temporary Environment UI Validation

on:
  push:
    branches:
      - refactor/environment-config-surface-20261002

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:blogctl-extension
