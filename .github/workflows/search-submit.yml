name: Submit all URLs to search engines

on:
  workflow_dispatch:
    inputs:
      google_inspection_offset:
        description: Zero-based offset into sitemap-all.txt for Google URL Inspection
        required: false
        default: 0
        type: number
      google_inspection_limit:
        description: URLs to inspect in this run (max 2000 per site per day)
        required: false
        default: 2000
        type: number

permissions:
  contents: read

concurrency:
  group: search-submit
  cancel-in-progress: false

env:
  GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'https://thinkerqaq.github.io/' }}

jobs:
  submit:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout search tooling
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download live URL inventory
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            "https://thinkerqaq.github.io/sitemap-all.txt" \
            --output "$RUNNER_TEMP/sitemap-all.txt"
          test -s "$RUNNER_TEMP/sitemap-all.txt"
          echo "Live URL count: $(grep -cve '^[[:space:]]*$' "$RUNNER_TEMP/sitemap-all.txt")"

      - name: Submit all URLs to Bing via IndexNow
        env:
          INDEXNOW_ENDPOINT: https://www.bing.com/indexnow
        run: |
          node tools/blogctl/search/node/cli.mjs submit \
            --providers indexnow \
            --urls-file "$RUNNER_TEMP/sitemap-all.txt" \
            --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL" \
            --public public

      - name: Submit sitemaps to Google Search Console
        run: |
          node tools/blogctl/search/node/cli.mjs submit \
            --providers google \
            --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL"

      - name: Inspect URLs with Google Search Console
        run: |
          node tools/blogctl/search/node/cli.mjs audit \
            --provider google \
            --urls-file "$RUNNER_TEMP/sitemap-all.txt" \
            --offset "${{ inputs.google_inspection_offset }}" \
            --limit "${{ inputs.google_inspection_limit }}" \
            --output "$RUNNER_TEMP/google-url-inspection.json" \
            --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL"

      - name: Upload Google URL Inspection report
        uses: actions/upload-artifact@v4
        with:
          name: google-url-inspection-${{ inputs.google_inspection_offset }}-${{ inputs.google_inspection_limit }}
          path: ${{ runner.temp }}/google-url-inspection.json
          if-no-files-found: error
          retention-days: 7
