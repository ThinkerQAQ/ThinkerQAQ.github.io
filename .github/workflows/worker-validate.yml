name: Validate optional site Workers

on:
  pull_request:
    paths:
      - "workers/blog-ai/**"
      - "workers/blog-reactions/**"
      - ".github/workflows/worker-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test site-owned analytics, AI and reactions in isolation
        run: |
          node --test workers/blog-ai/src/*.test.js
          node --test workers/blog-reactions/src/*.test.js
      - name: Check removed monorepo paths are not reintroduced
        run: |
          ! grep -R -n 'tools/blogctl/' workers/blog-ai/README.md workers/blog-reactions/README.md
