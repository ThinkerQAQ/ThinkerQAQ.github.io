name: Check AI Search health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ai-search-health
  cancel-in-progress: true

jobs:
  health:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Cloudflare AI Search indexing state
        id: health
        run: node scripts/check-ai-search-health.mjs

      - name: Evaluate AI Search retrieval
        if: steps.health.outputs.ready == 'true'
        run: node scripts/eval-ai-search.mjs
