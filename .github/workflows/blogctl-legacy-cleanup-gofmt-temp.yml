name: Temp BlogCTL Legacy Cleanup Gofmt

on:
  push:
    branches:
      - refactor/blogctl-remove-legacy-publishing-20261002

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false
      - name: Format compiler cleanup
        run: |
          gofmt -w tools/blogctl/compiler/service.go tools/blogctl/compiler/service_integration_test.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/compiler
          git commit -m "style(publishing): gofmt legacy cleanup"
          git push
