name: Temporary BlogCTL article registry

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace

      - name: Enrich article registry
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/blogctl/bridge/control.go")
          text = path.read_text()
          old = "type articleSummary struct {\n\tSlug   string `json:\"slug\"`\n\tTitle  string `json:\"title\"`\n\tStatus string `json:\"status\"`\n}"
          new = "type articleSummary struct {\n\tSlug          string `json:\"slug\"`\n\tTitle         string `json:\"title\"`\n\tStatus        string `json:\"status\"`\n\tLanguage      string `json:\"language\"`\n\tEnglishMirror bool   `json:\"englishMirror\"`\n\tSourcePath    string `json:\"sourcePath\"`\n}"
          if old not in text:
              raise SystemExit("articleSummary block not found")
          text = text.replace(old, new, 1)

          old = '\t\tarticles = append(articles, articleSummary{Slug: slug, Title: title, Status: "published"})'
          new = '\n'.join([
              '\t\tenglishMirror := filePresent(filepath.Join(articleRoot, "en", filepath.FromSlash(slug)+".md"))',
              '\t\tarticles = append(articles, articleSummary{',
              '\t\t\tSlug: slug, Title: title, Status: "published", Language: "zh-CN",',
              '\t\t\tEnglishMirror: englishMirror, SourcePath: filepath.ToSlash(relative),',
              '\t\t})',
          ])
          if old not in text:
              raise SystemExit("article append marker not found")
          path.write_text(text.replace(old, new, 1))

      - name: Add article registry tests
        shell: bash
        run: |
          cat > tools/blogctl/bridge/control_article_test.go <<'EOF'
          package bridge

          import (
          	"os"
          	"path/filepath"
          	"testing"
          )

          func TestListArticlesIncludesSourceLanguageAndEnglishMirror(t *testing.T) {
          	root := t.TempDir()
          	articleRoot := filepath.Join(root, "src", "content", "articles")
          	if err := os.MkdirAll(filepath.Join(articleRoot, "en", "nested"), 0o755); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.MkdirAll(filepath.Join(articleRoot, "nested"), 0o755); err != nil {
          		t.Fatal(err)
          	}
          	cn := "---\ntitle: 中文标题\nstatus: published\n---\n正文\n"
          	en := "---\ntitle: English title\nstatus: published\n---\nBody\n"
          	if err := os.WriteFile(filepath.Join(articleRoot, "nested", "example.md"), []byte(cn), 0o644); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(filepath.Join(articleRoot, "en", "nested", "example.md"), []byte(en), 0o644); err != nil {
          		t.Fatal(err)
          	}

          	articles, err := listArticles(root)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(articles) != 1 {
          		t.Fatalf("articles = %#v", articles)
          	}
          	got := articles[0]
          	if got.Slug != "nested/example" || got.Language != "zh-CN" || !got.EnglishMirror || got.SourcePath != "nested/example.md" {
          		t.Fatalf("article = %#v", got)
          	}
          }

          func TestListArticlesReportsMissingEnglishMirror(t *testing.T) {
          	root := t.TempDir()
          	articleRoot := filepath.Join(root, "src", "content", "articles")
          	if err := os.MkdirAll(articleRoot, 0o755); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(filepath.Join(articleRoot, "only-cn.md"), []byte("---\ntitle: Only CN\n---\n"), 0o644); err != nil {
          		t.Fatal(err)
          	}
          	articles, err := listArticles(root)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(articles) != 1 || articles[0].EnglishMirror {
          		t.Fatalf("articles = %#v", articles)
          	}
          }
          EOF

      - name: Format and test Bridge
        working-directory: tools/blogctl
        run: |
          gofmt -w bridge/control.go bridge/control_article_test.go
          go test ./bridge

      - name: Commit article registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/bridge/control.go tools/blogctl/bridge/control_article_test.go
          git commit -m "feat: enrich BlogCTL article registry"
          git push origin HEAD:refactor/blogctl-content-workspace
