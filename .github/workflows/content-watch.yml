name: Watch private blog content

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content-watch.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: blog-content-watch
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    env:
      CONTENT_REPOSITORY_SSH: git@github.com:ThinkerQAQ/blog-content.git
      BLOG_CONTENT_DEPLOY_KEY: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read latest private content SHA
        id: content
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLOG_CONTENT_DEPLOY_KEY" || {
            echo "::error::BLOG_CONTENT_DEPLOY_KEY is required"
            exit 1
          }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLOG_CONTENT_DEPLOY_KEY" > "$HOME/.ssh/blog-content"
          chmod 600 "$HOME/.ssh/blog-content"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts" 2>/dev/null

          latest_sha="$(GIT_SSH_COMMAND="ssh -i $HOME/.ssh/blog-content -o IdentitiesOnly=yes" git ls-remote "$CONTENT_REPOSITORY_SSH" refs/heads/master | awk '{print $1}')"
          test -n "$latest_sha" || {
            echo "::error::Could not resolve blog-content/master"
            exit 1
          }

          previous_sha=""
          if git ls-remote --exit-code --heads origin deployment-state >/dev/null 2>&1; then
            git fetch --quiet origin deployment-state
            previous_sha="$(git show FETCH_HEAD:deploy-state/content-sha.txt 2>/dev/null | tr -d '\r\n' || true)"
          fi

          echo "latest_sha=$latest_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

          if [ "$latest_sha" = "$previous_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Content already deployed: $latest_sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content changed: previous=${previous_sha:-<none>} latest=$latest_sha"
          fi

      - name: Avoid duplicate deployment
        id: active
        if: steps.content.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          in_progress="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=in_progress&per_page=1" --jq '.total_count')"
          queued="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=queued&per_page=1" --jq '.total_count')"

          if [ "$in_progress" -gt 0 ] || [ "$queued" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "A site deployment is already queued or running; a later watch will retry."
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch content deployment
        if: steps.content.outputs.changed == 'true' && steps.active.outputs.busy != 'true'
        env:
          CONTENT_SHA: ${{ steps.content.outputs.latest_sha }}
          CONTENT_BEFORE_SHA: ${{ steps.content.outputs.previous_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$CONTENT_BEFORE_SHA" ]; then
            payload="$(jq -n --arg ref "main" --arg content_sha "$CONTENT_SHA" --arg content_before_sha "$CONTENT_BEFORE_SHA" '{ref:$ref,inputs:{content_sha:$content_sha,content_before_sha:$content_before_sha,force_full_ai_search_sync:false}}')"
          else
            payload="$(jq -n --arg ref "main" --arg content_sha "$CONTENT_SHA" '{ref:$ref,inputs:{content_sha:$content_sha,content_before_sha:"",force_full_ai_search_sync:true}}')"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" --input - <<<"$payload"
          echo "Dispatched deploy.yml for content $CONTENT_SHA"
