name: Temp BlogCTL R2 Refactor Validation

on:
  push:
    branches:
      - refactor/blogctl-r2-go-runtime-20261002

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l tools/blogctl)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test BlogCTL Go
        run: go test ./tools/blogctl/...

      - name: Install Node dependencies
        run: npm ci

      - name: Test compiler and image adapter
        shell: bash
        run: |
          node --check tools/blogctl/assets/node/image-tool.mjs
          node --test \
            tools/blogctl/assets/node/image-tool.test.mjs \
            tools/blogctl/compiler/node/runtime-config.test.mjs \
            tools/blogctl/compiler/node/compiler.test.mjs \
            tools/blogctl/compiler/node/index.test.mjs

      - name: Verify real Mermaid and PlantUML renderers
        shell: bash
        run: |
          cat > tools/blogctl/assets/renderer_integration_temp_test.go <<'EOF'
          package assets

          import (
            "context"
            "os"
            "path/filepath"
            "testing"

            blogcompiler "github.com/ThinkerQAQ/ThinkerQAQ.github.io/tools/blogctl/compiler"
          )

          func TestTempRendererIntegration(t *testing.T) {
            engineRoot, err := filepath.Abs("../../..")
            if err != nil {
              t.Fatal(err)
            }
            contentRoot := t.TempDir()
            pipeline := &Pipeline{
              EngineRoot: engineRoot,
              ContentRoot: contentRoot,
              Mermaid: MermaidPolicy{Width: 640, Scale: 1},
            }
            values := []blogcompiler.Asset{
              {
                Kind: "mermaid",
                ID: "cccccccccccccccccccccccc",
                Renderer: MermaidCLIPackage,
                Definition: "flowchart LR\nA --> B",
              },
              {
                Kind: "plantuml",
                ID: "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd",
                Renderer: "plantuml",
                Definition: "@startuml\nAlice -> Bob: hello\n@enduml",
              },
            }
            if err := pipeline.Prepare(context.Background(), values); err != nil {
              t.Fatal(err)
            }
            for _, value := range values {
              file := filepath.Join(contentRoot, ".distribution", "assets", value.Kind, value.ID+".png")
              info, err := os.Stat(file)
              if err != nil || info.Size() == 0 {
                t.Fatalf("rendered asset %s missing: %v", file, err)
              }
            }
          }
          EOF
          gofmt -w tools/blogctl/assets/renderer_integration_temp_test.go
          go test ./tools/blogctl/assets -run TestTempRendererIntegration -count=1 -v
          rm tools/blogctl/assets/renderer_integration_temp_test.go
