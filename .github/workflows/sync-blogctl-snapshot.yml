name: Sync latest BlogCTL snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-blogctl-snapshot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/engine-split

      - name: Checkout latest legacy BlogCTL snapshot
        uses: actions/checkout@v4
        with:
          repository: ThinkerQAQ/ThinkerQAQ.github.io
          ref: 39c66aba8dad7fc2b3ed35b528a03637b1af4a8a
          path: _legacy
          persist-credentials: false

      - name: Replace BlogCTL with latest snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/blogctl
          mkdir -p tools
          cp -a _legacy/tools/blogctl tools/blogctl
          rm -rf _legacy

      - name: Verify BlogCTL
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat tools/blogctl/VERSION)" = "0.1.4"
          cd tools/blogctl
          go test ./...

      - name: Commit latest BlogCTL snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl
          if git diff --cached --quiet; then
            echo "BlogCTL is already current."
            exit 0
          fi
          git commit -m "chore: sync BlogCTL 0.1.4 snapshot"
          git push origin HEAD:migration/engine-split
