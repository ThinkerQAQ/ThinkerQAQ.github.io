name: Retire legacy Blog AI Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-blog-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retire-blog-ai
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
    steps:
      - name: Require configured access to both services
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UMAMI_WEBSITE_ID"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify EdgeOne POST reaches Umami Cloud before removing fallback
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg website "$UMAMI_WEBSITE_ID" '{type:"event",payload:{website:$website,hostname:"thinkerqaq.com",url:"https://thinkerqaq.com/",screen:"1920x1080",language:"zh-CN",title:"EdgeOne collection probe",referrer:"",name:"edgeone_proxy_smoke"}}')"
          for attempt in $(seq 1 15); do
            code="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
              -o "$RUNNER_TEMP/edgeone-proxy-response.json" -w '%{http_code}' \
              -X POST "https://thinkerqaq.com/api/send" \
              -H "Origin: https://thinkerqaq.com" \
              -H "Content-Type: application/json" \
              -H "x-umami-website-id: $UMAMI_WEBSITE_ID" \
              -H "x-umami-hostname: thinkerqaq.com" \
              --data-binary "$payload")" || code="000"
            if [ "$code" = "200" ]; then
              echo "Confirmed: EdgeOne /api/send forwarded an Umami event successfully"
              exit 0
            fi
            echo "EdgeOne proxy not ready (attempt=$attempt http_status=$code)"
            if [ "$attempt" -lt 15 ]; then sleep 10; fi
          done
          echo "::error::No validated upstream response; legacy Worker remains in place."
          exit 1

      - name: Delete only thinkerqaq-blog-ai Worker
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/worker-delete-response.json" -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/thinkerqaq-blog-ai")"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::error::Cloudflare deletion failed (status=$code)"
            cat "$RUNNER_TEMP/worker-delete-response.json" | jq '{success,errors}' || true
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/worker-delete-response.json" ]; then
            jq -e '.success == true' "$RUNNER_TEMP/worker-delete-response.json" >/dev/null
          fi
          echo "Deleted legacy thinkerqaq-blog-ai Worker only"

      - name: Verify deleted Worker is absent
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -o "$RUNNER_TEMP/worker-verify-response.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/thinkerqaq-blog-ai")"
          if [ "$code" != "404" ]; then
            echo "::error::Legacy Worker still present or verification failed (status=$code)"
            exit 1
          fi
          echo "Confirmed: legacy Worker no longer exists; reactions Worker was not touched"
