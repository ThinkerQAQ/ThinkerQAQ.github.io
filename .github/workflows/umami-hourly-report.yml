name: Snapshot Umami hourly analytics

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/umami-hourly-report.yml"
      - "scripts/umami-hourly-report.mjs"
      - "scripts/umami-hourly-report.test.mjs"

permissions:
  contents: write

concurrency:
  group: umami-hourly-analytics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test hourly analytics collector
        run: node --test scripts/umami-hourly-report.test.mjs

      - name: Fetch latest Umami window
        env:
          UMAMI_SHARE_SLUG: rroJe4zvqujFgYS0
          UMAMI_REPORT_HOURS: "1"
          UMAMI_REPORT_OUTPUT: /tmp/umami-latest.json
        run: node scripts/umami-hourly-report.mjs

      - name: Publish analytics snapshot branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin analytics-data >/dev/null 2>&1; then
            git fetch origin analytics-data
            git switch --force-create analytics-data origin/analytics-data
          else
            git switch --orphan analytics-data
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p umami
          cp /tmp/umami-latest.json umami/latest.json

          git add -A
          if git diff --cached --quiet; then
            echo "No analytics snapshot changes to publish."
            exit 0
          fi

          git commit -m "chore: update Umami hourly snapshot"
          git push origin HEAD:analytics-data
