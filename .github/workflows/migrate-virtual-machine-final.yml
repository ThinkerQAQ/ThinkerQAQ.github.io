name: Migrate Virtual Machine notes on latest master

on:
  push:
    branches:
      - migrate/virtual-machine-notes-final

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure reviewed Virtual Machine policy
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/content-policy.mjs')
          s = p.read_text(encoding='utf-8')
          def r(old, new):
              global s
              if old not in s: raise SystemExit(f'marker missing: {old!r}')
              s = s.replace(old, new, 1)
          r('  "Operating_System",\n];', '  "Operating_System",\n  "Virtual_Machine",\n];')
          r('  Operating_System: "Operating System / Linux",\n};', '  Operating_System: "Operating System / Linux",\n  Virtual_Machine: "Garbage Collection / Runtime",\n};')
          r('  Operating_System: "operating-system",\n};', '  Operating_System: "operating-system",\n  Virtual_Machine: "garbage-collection",\n};')
          r('  Operating_System: "Overview",\n};', '  Operating_System: "Overview",\n  Virtual_Machine: "Fundamentals",\n};')
          block = r'''
          const VIRTUAL_MACHINE_NOTE_TOPICS = [
            { id: "fundamentals", label: "Fundamentals", number: 1, notes: ["GC.md", "STW.md", "内存泄露.md"] },
            { id: "tuning", label: "Tuning", number: 2, notes: ["GC调优.md"] },
          ];
          const virtualMachineTopicEntries = VIRTUAL_MACHINE_NOTE_TOPICS.flatMap((topic) =>
            topic.notes.map((note) => [note, { id: topic.id, label: topic.label, number: topic.number }]),
          );

          '''
          marker = '// Notebooks listed here use a strict per-note allowlist.'
          if marker not in s: raise SystemExit('allowlist marker missing')
          s = s.replace(marker, block + marker, 1)
          r('  Operating_System: new Set(\n    operatingSystemTopicEntries.map(([note]) => `Operating_System/${note}`),\n  ),\n};', '  Operating_System: new Set(\n    operatingSystemTopicEntries.map(([note]) => `Operating_System/${note}`),\n  ),\n  Virtual_Machine: new Set(virtualMachineTopicEntries.map(([note]) => `Virtual_Machine/${note}`)),\n};')
          r('  Operating_System: new Map(operatingSystemTopicEntries),\n};', '  Operating_System: new Map(operatingSystemTopicEntries),\n  Virtual_Machine: new Map(virtualMachineTopicEntries),\n};')
          p.write_text(s, encoding='utf-8')

          p = Path('package.json')
          s = p.read_text(encoding='utf-8')
          old = 'scripts/operating-system-policy.test.mjs'
          if old not in s: raise SystemExit('package marker missing')
          p.write_text(s.replace(old, old + ' scripts/virtual-machine-policy.test.mjs', 1), encoding='utf-8')

          Path('scripts/virtual-machine-policy.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { NOTE_TOPIC_OVERRIDES, REVIEWED_NOTE_PATHS } from "./content-policy.mjs";\nimport { sourceExclusionReason } from "./import-vnotes.mjs";\ntest("publishes exactly the reviewed Virtual Machine notes", () => {\n  assert.equal(REVIEWED_NOTE_PATHS.Virtual_Machine.size, 4);\n  assert.equal(NOTE_TOPIC_OVERRIDES.Virtual_Machine.size, 4);\n  for (const path of ["Virtual_Machine/GC.md", "Virtual_Machine/GC调优.md", "Virtual_Machine/STW.md", "Virtual_Machine/内存泄露.md"]) assert.equal(REVIEWED_NOTE_PATHS.Virtual_Machine.has(path), true, path);\n  assert.equal(sourceExclusionReason({ sourcePath: "Virtual_Machine" }, "other.md"), "not-reviewed");\n});\n''', encoding='utf-8')

      - name: Recover sanitized historical sources
        run: |
          rm -rf .migration
          mkdir -p .migration
          git archive 0e010570684010ef99d4055bb7c3d4611df44f4c:notes | tar -x -C .migration
          mkdir -p .migration/Virtual_Machine
          cat > .migration/Virtual_Machine/GC.md <<'EOF'
          ## 1. 什么是GC
          针对堆内存的自动内存回收机制
          ## 2. 为什么需要GC
          把程序员从手动free内存的工作中释放出来

          ### 2.1. GC的问题
          #### 2.1.1. 内存泄露
          [内存泄露.md](内存泄露.md)
          #### 2.1.2. STW
          [STW.md](STW.md)
          ## 3. 如何进行垃圾回收
          ### 3.1. GC触发
          定时或者内存空间不足时

          ### 3.2. 垃圾回收
          #### 3.2.1. 引用计数法
          每个对象都有一个计数器，有变量引用时+1，引用失效则-1。当计数器为0的时候则对其进行回收

          优点：简单高效
          缺点：无法解决循环引用的问题。循环引用是指A对象引用B对象，B对象又引用A对象，但是A,B对象已不被任何其他对象引用

          #### 3.2.2. 可达性分析
          从GC Root出发，通过引用关系遍历对象图，能到达的不是垃圾
          GC Root：全局变量、栈上的局部变量、寄存器上的变量

          ##### 3.2.2.1. 标记清除
          标记：从GC Root出发，标记所有可达的对象。未被标记的就是垃圾对象
          清除：清除所有未被标记的对象
          缺点：会产生内存碎片（不连续的内存空间）， 需要分配较大的对象时，无法找到足够的连续内存空间。
          ##### 3.2.2.2. 标记整理
          标记：从GC Root出发，标记所有可达的对象。未被标记的就是垃圾对象
          整理：把所有存活的对象移动到一边，对其他区域回收
          优点：解决了内存碎片的问题
          缺点：移动对象的成本较高
          ##### 3.2.2.3. 复制
          把内存空间分成两块，每次只使用其中一块，用完之后把存活的对象复制到另一块内存空间
          优点：效率高，没有内存碎片
          缺点：每次只能利用一半的空间

          ##### 3.2.2.4. 分代垃圾回收
          根据对象的存活时间把内存分成新生代和老年代
          新生代的特点是每次回收只有少量对象存活，因此采用改进的复制算法
          老年代的特点是有大量对象存活，采用标记清除、标记整理算法

          ## 4. GC调优
          [GC调优.md](GC调优.md)
          EOF
          cat > .migration/Virtual_Machine/GC调优.md <<'EOF'
          ## 1. GC调优步骤
          ### 1.1. 确定GC调优目的
          - CPU 利用率：回收算法会在多大程度上拖慢程序？有时候，这个是通过回收占用的 CPU 时间与其它 CPU 时间的百分比来描述的。
          - GC 停顿时间：回收器会造成多长时间的停顿？目前的 GC 中需要考虑 STW 和 Mark Assist 两个部分可能造成的停顿。
          - GC 停顿频率：回收器造成的停顿频率是怎样的？目前的 GC 中需要考虑 STW 和 Mark Assist 两个部分可能造成的停顿。
          - GC 可扩展性：当堆内存变大时，垃圾回收器的性能如何？但大部分的程序可能并不一定关心这个问题。

          ### 1.2. 观察GC

          ### 1.3. 调优
          #### 1.3.1. 调参数

          #### 1.3.2. 调代码
          EOF
          cat > .migration/Virtual_Machine/STW.md <<'EOF'
          ## 1. 什么是STW

          由于GC导致应用程序无法对外响应
          ## 2. 为什么会发生STW
          有GC的语言中最起码的有两个线程，用户线程和GC线程
          用户线程创建对象，GC回收对象，如果两个线程并发执行那可能把不是垃圾的对象给回收掉，需要GC期间会把用户线程暂停
          ## 3. 如何解决STW
          EOF
          cat > .migration/Virtual_Machine/内存泄露.md <<'EOF'
          ## 1. 什么是内存泄露

          内存不断膨胀无法回收内存最后发生OOM，这就是内存泄漏，最后发生OOM
          ## 2. 为什么会发生内存泄露
          GC没法回收被Root对象引用的内存
          ## 3. 如何解决内存泄露
          关键是找到没被释放的Root对象
          ### 3.1. 资源没有释放
          ### 3.2. 线程等资源创建太多
          ### 3.3. 非GC管理的内存
          EOF
          sed -i 's/^          //' .migration/Virtual_Machine/*.md
          cat > .migration/Virtual_Machine/_vnote.json <<'EOF'
          {"created_time":"2026-09-08T13:53:06Z","files":[{"attachment_folder":"","attachments":[],"modified_time":"2026-09-08T13:53:06Z","name":"GC.md","tags":[]},{"attachment_folder":"","attachments":[],"modified_time":"2026-09-08T13:53:06Z","name":"GC调优.md","tags":[]},{"attachment_folder":"","attachments":[],"modified_time":"2026-09-08T13:53:06Z","name":"STW.md","tags":[]},{"attachment_folder":"","attachments":[],"modified_time":"2026-09-08T13:53:06Z","name":"内存泄露.md","tags":[]}],"sub_directories":[],"version":"1"}
          EOF
          sed -i 's/^          //' .migration/Virtual_Machine/_vnote.json

      - run: npm ci
      - name: Import and verify
        env:
          VNOTE_SOURCE: ${{ github.workspace }}/.migration
          VNOTE_IMPORT_IDS: garbage-collection
        run: |
          npm run sync:notes
          node --test scripts/virtual-machine-policy.test.mjs
          test "$(find src/content/notes/garbage-collection -type f -name '*.md' | wc -l)" -eq 4
          ! grep -RniE 'woa\.com|(^|[^a-z])oa\.com|bytedance\.feishu\.cn|bytedance\.larkoffice\.com|INTERNAL_URL' src/content/notes/garbage-collection

      - name: Annotate historical claims
        shell: python
        run: |
          from pathlib import Path
          notes = {
            'GC.md': '> 这是一篇早期的跨语言 GC 概念笔记。不同运行时和版本的 GC 触发条件、GC Root 定义与回收策略并不相同；“分代垃圾回收”是一类常见设计，不是所有垃圾回收器都必须采用。',
            'GC调优.md': '> 这里记录的是通用的 GC 调优目标，但 `Mark Assist` 是 Go runtime 中的具体术语；实际可观测指标、参数和调优手段应以对应语言、运行时与版本为准。',
            'STW.md': '> STW 不等于“整个 GC 期间都暂停用户线程”。现代垃圾回收器通常会并发执行部分阶段，只在特定安全点、阶段切换或根扫描等环节暂停 mutator，具体取决于实现。',
            '内存泄露.md': '> 内存泄漏不要求内存必须持续增长直到 OOM。GC 语言中常见的是对象仍被意外保持可达而无法回收；资源泄漏以及非 GC 管理内存泄漏属于相关但不同的问题。',
          }
          root = Path('src/content/notes/garbage-collection')
          for name, annotation in notes.items():
              p = root / name
              text = p.read_text(encoding='utf-8')
              first = text.find('---\n')
              second = text.find('---\n', first + 4)
              pos = second + 4
              text = text[:pos] + f'\n## 0. 版本说明（2026）\n\n{annotation}\n\n' + text[pos:].lstrip('\n')
              p.write_text(text, encoding='utf-8')

      - name: Test and commit
        run: |
          npm run test:vnotes
          rm -rf .migration
          git add package.json scripts/content-policy.mjs scripts/virtual-machine-policy.test.mjs src/content/notes/garbage-collection src/data/content-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: publish reviewed virtual machine notes [skip ci]'
          git push
