name: Cleanup migration duplicates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-migration-duplicates.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: migration/engine-split

      - name: Remove accidentally nested migration directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            src/components/components \
            src/config/config \
            src/layouts/layouts \
            src/lib/lib \
            src/pages/pages \
            src/styles/styles \
            scripts/drawio/drawio \
            scripts/plantuml/plantuml \
            workers/workers

          forbidden=(src/content public/media src/data/content-manifest.json)
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Forbidden private/content path present: $path" >&2
              exit 1
            fi
          done

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No duplicate directories remain."
            exit 0
          fi
          git commit -m "fix: remove nested migration duplicates"
          git push origin HEAD:migration/engine-split
