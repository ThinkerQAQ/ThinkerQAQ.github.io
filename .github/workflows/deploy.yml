name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_ASK_BLOG_WORKER_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL }}
      PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY }}
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Java for local PlantUML rendering
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Test diagrams
        run: npm run test:diagrams
      - name: Test IndexNow
        run: npm run test:indexnow
      - name: Test distribution
        run: npm run test:distribute
      - name: Test VNote import and policies
        run: npm run test:vnotes
      - name: Check AI search scripts
        run: npm run test:ai-search
      - name: Test Helpful reactions
        run: npm run test:reactions
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify build output
        run: npm run verify
      - name: Prepare IndexNow payload
        run: node scripts/indexnow.mjs prepare --output "$RUNNER_TEMP/indexnow-payload.json"
      - name: Upload IndexNow payload
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow-payload.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-search:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync public Markdown to Cloudflare AI Search
        run: node scripts/sync-ai-search.mjs
      - name: Evaluate AI Search retrieval
        run: node scripts/eval-ai-search.mjs

  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download IndexNow payload
        uses: actions/download-artifact@v5
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow
      - name: Notify IndexNow after deployment
        run: node scripts/indexnow.mjs submit --input "$RUNNER_TEMP/indexnow/indexnow-payload.json"
