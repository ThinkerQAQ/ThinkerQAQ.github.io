name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Java for local PlantUML rendering
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check whether note link resolution needs migration
        id: note-link-fix
        shell: bash
        run: |
          if grep -Fq 'export function resolvePublishedNoteTarget(absoluteTarget, publicNoteIndex) {' scripts/import-vnotes.mjs; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fix note link resolution
        if: ${{ steps.note-link-fix.outputs.needed == 'true' }}
        run: node scripts/patch-note-link-resolution.mjs
      - name: Re-import reviewed Go notes after link fix
        if: ${{ steps.note-link-fix.outputs.needed == 'true' }}
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/legacy-vnote" 0e010570684010ef99d4055bb7c3d4611df44f4c
          LEGACY_VNOTE_SOURCE="$RUNNER_TEMP/legacy-vnote/notes" node scripts/import-go-from-legacy.mjs
          git worktree remove "$RUNNER_TEMP/legacy-vnote" --force
      - name: Test and build static site
        run: npm test
      - name: Commit reviewed note changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- scripts/import-vnotes.mjs scripts/import-vnotes.test.mjs src/content/notes/go public/media/vnote/go src/data/content-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/import-vnotes.mjs scripts/import-vnotes.test.mjs src/content/notes/go src/data/content-manifest.json
            if [ -d public/media/vnote/go ]; then git add public/media/vnote/go; fi
            git commit -m "fix: preserve unpublished note link targets"
            git push origin HEAD:master
          fi
      - name: Prepare IndexNow payload
        run: node scripts/indexnow.mjs prepare --output "$RUNNER_TEMP/indexnow-payload.json"
      - name: Upload IndexNow payload
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow-payload.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download IndexNow payload
        uses: actions/download-artifact@v5
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow
      - name: Notify IndexNow after deployment
        run: node scripts/indexnow.mjs submit --input "$RUNNER_TEMP/indexnow/indexnow-payload.json"
