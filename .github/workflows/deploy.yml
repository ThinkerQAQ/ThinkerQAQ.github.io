name: Deploy blog to GitHub Pages and EdgeOne

on:
  push:
    branches: [main]
  # Publish completed workout months even when the content repository has no new commit.
  # First day of each month, 08:15 Asia/Shanghai (GitHub Actions cron is UTC).
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional private content commit to deploy
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      CONTENT_REPOSITORY: ${{ github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && 'ThinkerQAQ/blog-content' || vars.CONTENT_REPOSITORY }}
    steps:
      - name: Checkout site deployment wrapper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: site
          fetch-depth: 2

      - name: Checkout pinned Inkerio
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/inkerio
          ref: 2ef62f71a9b84368c022342cc5a12e43168944d9
          path: engine
          persist-credentials: false

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ inputs.content_sha || '' }}
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Load site origin from configuration
        run: |
          origin="$(node -p 'require("./site/site.config.json").url')"
          echo "BLOG_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk libnspr4 libnss3 libasound2t64

      # Ubuntu runners restrict Chromium's user-namespace sandbox. The renderer
      # operates only during this ephemeral CI build, not on visitor requests.
      - name: Configure Mermaid headless Chromium for CI
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/mermaid-puppeteer.json"
          echo "MERMAID_PUPPETEER_CONFIG_FILE=$RUNNER_TEMP/mermaid-puppeteer.json" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
        uses: actions/configure-pages@v5

      - name: Inject site-specific configuration into pinned Inkerio
        run: node site/scripts/prepare-inkerio-deployment.mjs --engine engine --site site

      - name: Build pinned Inkerio
        working-directory: engine
        run: |
          npm ci
          node scripts/assemble-content.mjs --content-root ../content-source
          node ../site/scripts/prepare-project-readme-frontmatter.mjs src/content/projects
          npm run build
          npm run check
          mkdir -p ../publish-dist
          cp -a dist/. ../publish-dist/

      - name: Verify configured home, RSS, and legacy redirect output
        run: node site/scripts/verify-site-features.mjs --engine engine --site site

      # Compare against the still-live previous deployment before replacing it.
      - name: Prepare URL removals for IndexNow
        run: node site/scripts/prepare-removed-url-notifications.mjs --site site --new-list publish-dist/sitemap-all.txt --output "$RUNNER_TEMP/removed-urls.txt"

      - name: Retain private removal inventory for post-deploy notification
        uses: actions/upload-artifact@v4
        with:
          name: removed-urls
          path: ${{ runner.temp }}/removed-urls.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish-dist

      - name: Generate EdgeOne 301 rules from site-owned aliases
        run: node site/scripts/prepare-edgeone-redirects.mjs --site site --dist publish-dist

      - name: Bundle the site-owned Umami proxy function
        run: |
          install -D -m 644 site/edge-functions/api/send.js publish-dist/edge-functions/api/send.js
          test -s publish-dist/edge-functions/api/send.js

      - name: Upload EdgeOne artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-dist
          path: publish-dist
          if-no-files-found: error
          retention-days: 1

  deploy-edgeone:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download EdgeOne artifact
        uses: actions/download-artifact@v5
        with:
          name: edgeone-dist
          path: dist

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy ./dist -n thinkerqaq-blog-static -t "$EDGEONE_API_TOKEN" -e production

  deploy:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy-edgeone
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:thinkerqaq.com' }}
    steps:
      - name: Checkout site deployment wrapper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: site

      - name: Checkout pinned public SyndiRelay (read-only)
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/syndirelay
          ref: cc8e4baf354b941fd752bb5abe79d4ba079463d3
          path: relay
          persist-credentials: false

      - name: Download pre-deploy removed URL inventory
        uses: actions/download-artifact@v5
        with:
          name: removed-urls
          path: ${{ runner.temp }}/removed-urls

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Build SyndiRelay for search notifications
        working-directory: relay
        run: go build -o "$RUNNER_TEMP/syndirelay" ./cmd

      - name: Prepare isolated search settings
        run: node site/scripts/prepare-search-notify.mjs --site site --relay relay --data "$RUNNER_TEMP/syndirelay-search"

      - name: Notify IndexNow of deleted pages
        working-directory: relay
        env:
          SYNDIRELAY_DATA_DIR: ${{ runner.temp }}/syndirelay-search
        shell: bash
        run: |
          set -euo pipefail
          removed="$RUNNER_TEMP/removed-urls/removed-urls.txt"
          test -f "$removed"
          if [[ -s "$removed" ]]; then
            "$RUNNER_TEMP/syndirelay" search submit --providers indexnow --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL" --urls-file "$removed"
          else
            echo "[search:indexnow] no removed URLs to notify"
          fi

      - name: Notify search engines
        working-directory: relay
        env:
          SYNDIRELAY_DATA_DIR: ${{ runner.temp }}/syndirelay-search
        shell: bash
        run: |
          set -euo pipefail

          args=(search notify --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL")
          if [[ -n "${GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            credentials="$RUNNER_TEMP/google-search-console-service-account.json"
            umask 077
            printf '%s' "$GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON" > "$credentials"
            args+=(--google-service-account-file "$credentials")
          fi

          "$RUNNER_TEMP/syndirelay" "${args[@]}"

  record-content-state:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && inputs.content_sha != ''
    runs-on: ubuntu-latest
    needs: [deploy-edgeone, deploy]
    permissions:
      contents: read
    env:
      CONTENT_SHA: ${{ inputs.content_sha }}
    steps:
      - name: Prepare deployed-content marker
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-content-state"
          printf '%s\n' "$CONTENT_SHA" > "$RUNNER_TEMP/deployed-content-state/content-sha.txt"
      - name: Retain marker with the successful deployment run
        uses: actions/upload-artifact@v4
        with:
          name: deployed-content-state
          path: ${{ runner.temp }}/deployed-content-state/content-sha.txt
          retention-days: 90
          if-no-files-found: error
