name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  # Publish completed workout months even when the content repository has no new commit.
  # First day of each month, 08:15 Asia/Shanghai (GitHub Actions cron is UTC).
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional private content commit to deploy
        required: false
        type: string
      content_before_sha:
        description: Optional previous private content commit for incremental AI Search sync
        required: false
        type: string
      force_full_ai_search_sync:
        description: Explicitly allow a full AI Search reconcile when no incremental base is available
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ai_search_artifact_ready: ${{ steps.ai_search_upload.outcome == 'success' }}
    env:
      PUBLIC_ASK_BLOG_WORKER_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev/chat' }}
      PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY }}
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      PUBLIC_UMAMI_PROXY_ORIGIN: ${{ vars.PUBLIC_UMAMI_PROXY_ORIGIN || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev' }}
      CONTENT_REPOSITORY: ${{ github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && 'ThinkerQAQ/blog-content' || vars.CONTENT_REPOSITORY }}
    steps:
      - name: Checkout site deployment wrapper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: site
          fetch-depth: 2

      - name: Checkout pinned Inkerio
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/inkerio
          ref: 715ef65335a02b24cc65185e55de7a03bfe7e1c2
          path: engine
          persist-credentials: false

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ inputs.content_sha || '' }}
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          # Keep the read-only deploy-key credential available for the later
          # incremental diff fetch of content_before_sha in this same job.
          persist-credentials: true

      - name: Checkout pinned private SyndiRelay (read-only)
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/syndirelay
          ref: cc8e4baf354b941fd752bb5abe79d4ba079463d3
          ssh-key: ${{ secrets.SYNDIRELAY_DEPLOY_KEY }}
          path: relay
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Build private search and AI Search CLI
        working-directory: relay
        run: go build -o "$RUNNER_TEMP/syndirelay" ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Load site origin from configuration
        run: |
          origin="$(node -p 'require("./site/site.config.json").url')"
          echo "BLOG_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk libnspr4 libnss3 libasound2t64

      # Ubuntu runners restrict Chromium's user-namespace sandbox. The renderer
      # operates only during this ephemeral CI build, not on visitor requests.
      - name: Configure Mermaid headless Chromium for CI
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/mermaid-puppeteer.json"
          echo "MERMAID_PUPPETEER_CONFIG_FILE=$RUNNER_TEMP/mermaid-puppeteer.json" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
        uses: actions/configure-pages@v5

      - name: Inject site-specific configuration into pinned Inkerio
        run: node site/scripts/prepare-inkerio-deployment.mjs --engine engine --site site

      - name: Build pinned Inkerio
        working-directory: engine
        run: |
          npm ci
          node scripts/assemble-content.mjs --content-root ../content-source
          npm run check
          npm run build
          mkdir -p ../publish-dist
          cp -a dist/. ../publish-dist/

      - name: Prepare AI Search input
        id: ai_search_prepare
        continue-on-error: true
        working-directory: relay
        env:
          CONTENT_SHA: ${{ inputs.content_sha || '' }}
          CONTENT_BEFORE_SHA: ${{ inputs.content_before_sha || '' }}
          AI_SEARCH_FORCE_FULL_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
        run: '"$RUNNER_TEMP/syndirelay" ai-search prepare --output "$RUNNER_TEMP/ai-search-input" --content-root ../content-source'

      - name: Upload public AI Search input
        id: ai_search_upload
        if: steps.ai_search_prepare.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-input
          path: ${{ runner.temp }}/ai-search-input
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish-dist

      - name: Upload EdgeOne artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-dist
          path: publish-dist
          if-no-files-found: error
          retention-days: 1

  deploy-edgeone:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download EdgeOne artifact
        uses: actions/download-artifact@v5
        with:
          name: edgeone-dist
          path: dist

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy ./dist -n thinkerqaq-blog-static -t "$EDGEONE_API_TOKEN" -e production

  deploy:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-search:
    # Incremental sync needs a previous content SHA or explicit full reconcile.
    # Failed preparation must not trigger a missing-artifact download.
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && needs.build.outputs.ai_search_artifact_ready == 'true'
    runs-on: ubuntu-latest
    needs: [build, deploy-edgeone]
    continue-on-error: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_REQUEST_TIMEOUT_MS: 120000
      AI_SEARCH_CHANGE_MANIFEST: ${{ github.workspace }}/relay/src/content/ai-search-changed-paths.txt
      AI_SEARCH_FORCE_FULL_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
    steps:
      - name: Checkout site deployment wrapper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: site

      - name: Checkout pinned private SyndiRelay (read-only)
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/syndirelay
          ref: cc8e4baf354b941fd752bb5abe79d4ba079463d3
          ssh-key: ${{ secrets.SYNDIRELAY_DEPLOY_KEY }}
          path: relay
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Build private search and AI Search CLI
        working-directory: relay
        run: go build -o "$RUNNER_TEMP/syndirelay" ./cmd

      - name: Setup Node for site configuration
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Load site origin from configuration
        run: |
          origin="$(node -p 'require("./site/site.config.json").url')"
          echo "BLOG_ORIGIN=$origin" >> "$GITHUB_ENV"

      - name: Download public AI Search input
        uses: actions/download-artifact@v5
        with:
          name: ai-search-input
          path: relay/src/content

      - name: Sync and verify AI Search
        working-directory: relay
        run: '"$RUNNER_TEMP/syndirelay" ai-search sync --verify'

  notify-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy-edgeone
    continue-on-error: true
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:thinkerqaq.com' }}
    steps:
      - name: Checkout site deployment wrapper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: site

      - name: Checkout pinned private SyndiRelay (read-only)
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/syndirelay
          ref: cc8e4baf354b941fd752bb5abe79d4ba079463d3
          ssh-key: ${{ secrets.SYNDIRELAY_DEPLOY_KEY }}
          path: relay
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Build private search and AI Search CLI
        working-directory: relay
        run: go build -o "$RUNNER_TEMP/syndirelay" ./cmd

      - name: Prepare isolated search settings
        run: node site/scripts/prepare-search-notify.mjs --site site --relay relay --data "$RUNNER_TEMP/syndirelay-search"

      - name: Notify search engines
        working-directory: relay
        env:
          SYNDIRELAY_DATA_DIR: ${{ runner.temp }}/syndirelay-search
        shell: bash
        run: |
          set -euo pipefail

          args=(search notify --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL")
          if [[ -n "${GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            credentials="$RUNNER_TEMP/google-search-console-service-account.json"
            umask 077
            printf '%s' "$GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON" > "$credentials"
            args+=(--google-service-account-file "$credentials")
          fi

          "$RUNNER_TEMP/syndirelay" "${args[@]}"

  record-content-state:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && inputs.content_sha != ''
    runs-on: ubuntu-latest
    needs: [deploy-edgeone, deploy]
    permissions:
      contents: read
    env:
      CONTENT_SHA: ${{ inputs.content_sha }}
    steps:
      - name: Prepare deployed-content marker
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-content-state"
          printf '%s\n' "$CONTENT_SHA" > "$RUNNER_TEMP/deployed-content-state/content-sha.txt"
      - name: Retain marker with the successful deployment run
        uses: actions/upload-artifact@v4
        with:
          name: deployed-content-state
          path: ${{ runner.temp }}/deployed-content-state/content-sha.txt
          retention-days: 90
          if-no-files-found: error
