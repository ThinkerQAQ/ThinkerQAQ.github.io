name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional private content commit to deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ASK_BLOG_WORKER_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev/chat' }}
      PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY }}
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      CONTENT_REPOSITORY: ${{ github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && 'ThinkerQAQ/blog-content' || vars.CONTENT_REPOSITORY }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          path: engine
          fetch-depth: 2

      - name: Validate content repository configuration
        run: |
          test -n "$CONTENT_REPOSITORY" || (echo "CONTENT_REPOSITORY repository variable is required before repository cutover" >&2; exit 1)

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ inputs.content_sha || '' }}
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Validate private content source contract
        working-directory: engine
        run: node scripts/validate-content-source.mjs ../content-source

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Configure GitHub Pages
        if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
        uses: actions/configure-pages@v5

      - name: Assemble private content into public engine
        working-directory: engine
        run: node scripts/assemble-content.mjs ../content-source

      - name: Test public engine
        working-directory: engine
        run: npm run test:engine

      - name: Astro check
        working-directory: engine
        run: npm run check

      - name: Build static site
        working-directory: engine
        run: npm run build

      - name: Prepare public AI Search input
        continue-on-error: true
        working-directory: engine
        run: node scripts/prepare-ai-search-input.mjs "$RUNNER_TEMP/ai-search-input"

      - name: Upload public AI Search input
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-input
          path: ${{ runner.temp }}/ai-search-input
          if-no-files-found: error
          retention-days: 1

      - name: Prepare IndexNow payload
        continue-on-error: true
        working-directory: engine
        run: node scripts/indexnow.mjs prepare --output "$RUNNER_TEMP/indexnow-payload.json"

      - name: Upload IndexNow payload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow-payload.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: engine/dist

  deploy:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_REQUEST_TIMEOUT_MS: 120000
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download public AI Search input
        uses: actions/download-artifact@v5
        with:
          name: ai-search-input
          path: engine/src/content

      - name: Sync public Markdown to Cloudflare AI Search
        working-directory: engine
        run: node scripts/run-ai-search-sync.mjs

      - name: Evaluate AI Search retrieval
        working-directory: engine
        run: node scripts/eval-ai-search.mjs

  notify-indexnow:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download IndexNow payload
        uses: actions/download-artifact@v5
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow

      - name: Notify IndexNow after deployment
        working-directory: engine
        run: node scripts/indexnow.mjs submit --input "$RUNNER_TEMP/indexnow/indexnow-payload.json"
