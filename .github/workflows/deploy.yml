name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional private content commit to deploy
        required: false
        type: string
      content_before_sha:
        description: Optional previous private content commit for incremental AI Search sync
        required: false
        type: string
      force_full_ai_search_sync:
        description: Explicitly allow a full AI Search reconcile when no incremental base is available
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ASK_BLOG_WORKER_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev/chat' }}
      PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY }}
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      CONTENT_REPOSITORY: ${{ github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && 'ThinkerQAQ/blog-content' || vars.CONTENT_REPOSITORY }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine
          fetch-depth: 2

      - name: Validate content repository configuration
        run: |
          test -n "$CONTENT_REPOSITORY" || (echo "CONTENT_REPOSITORY repository variable is required before repository cutover" >&2; exit 1)

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ inputs.content_sha || '' }}
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Validate private content source contract
        working-directory: engine
        run: node scripts/validate-content-source.mjs ../content-source

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Configure GitHub Pages
        if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
        uses: actions/configure-pages@v5

      - name: Assemble private content into public engine
        working-directory: engine
        run: node scripts/assemble-content.mjs ../content-source

      - name: Test public engine
        working-directory: engine
        run: npm run test:engine

      - name: Astro check
        working-directory: engine
        run: npm run check

      - name: Build static site
        working-directory: engine
        run: npm run build

      - name: Prepare public AI Search input
        continue-on-error: true
        working-directory: engine
        run: node scripts/prepare-ai-search-input.mjs "$RUNNER_TEMP/ai-search-input"

      - name: Prepare incremental AI Search change manifest
        env:
          CONTENT_SHA: ${{ inputs.content_sha || '' }}
          CONTENT_BEFORE_SHA: ${{ inputs.content_before_sha || '' }}
          FORCE_FULL_AI_SEARCH_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
        run: |
          manifest="$RUNNER_TEMP/ai-search-input/ai-search-changed-paths.txt"
          if [ "$FORCE_FULL_AI_SEARCH_SYNC" = "1" ]; then
            rm -f "$manifest"
            echo "Explicit full AI Search reconcile requested."
          elif [ -z "$CONTENT_SHA" ]; then
            : > "$manifest"
            echo "Engine-only deployment: content is unchanged, so AI Search will not re-upload existing documents."
          elif [ -z "$CONTENT_BEFORE_SHA" ] || [[ "$CONTENT_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Missing reliable content_before_sha for content deployment. Refusing silent full AI Search fallback; rerun with force_full_ai_search_sync=true only when a full reconcile is intended." >&2
            exit 1
          else
            git -C content-source fetch --no-tags --depth=1 origin "$CONTENT_BEFORE_SHA"
            git -C content-source diff --no-renames --name-only "$CONTENT_BEFORE_SHA" "$CONTENT_SHA" -- \
              src/content/articles src/content/notes src/content/note-translations > "$manifest"
            echo "AI Search changed content paths: $(wc -l < "$manifest")"
          fi

      - name: Upload public AI Search input
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-input
          path: ${{ runner.temp }}/ai-search-input
          if-no-files-found: error
          retention-days: 1

      - name: Prepare incremental IndexNow URL manifest
        continue-on-error: true
        working-directory: engine
        env:
          CONTENT_SHA: ${{ inputs.content_sha || '' }}
          CONTENT_BEFORE_SHA: ${{ inputs.content_before_sha || '' }}
        run: |
          urls="$RUNNER_TEMP/indexnow-changed-urls.txt"
          : > "$urls"
          if [ -z "$CONTENT_SHA" ]; then
            echo "Engine-only deployment: no content URLs need IndexNow notification."
          elif [ -z "$CONTENT_BEFORE_SHA" ] || [[ "$CONTENT_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "No reliable content_before_sha; skipping IndexNow instead of submitting the full sitemap inventory."
          else
            git -C ../content-source fetch --no-tags --depth=1 origin "$CONTENT_BEFORE_SHA"
            node tools/blogctl/search/node/content-changes.mjs \
              --repository ../content-source \
              --before "$CONTENT_BEFORE_SHA" \
              --after "$CONTENT_SHA" \
              --output "$urls"
          fi

      - name: Prepare IndexNow payload
        continue-on-error: true
        working-directory: engine
        run: node scripts/indexnow.mjs prepare --urls-file "$RUNNER_TEMP/indexnow-changed-urls.txt" --output "$RUNNER_TEMP/indexnow-payload.json"

      - name: Upload IndexNow payload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow-payload.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: engine/dist

  deploy:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_REQUEST_TIMEOUT_MS: 120000
      AI_SEARCH_CHANGE_MANIFEST: ${{ github.workspace }}/engine/src/content/ai-search-changed-paths.txt
      AI_SEARCH_FORCE_FULL_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download public AI Search input
        uses: actions/download-artifact@v5
        with:
          name: ai-search-input
          path: engine/src/content

      - name: Submit public Markdown to Cloudflare AI Search
        working-directory: engine
        run: node scripts/run-ai-search-sync.mjs

  notify-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'https://thinkerqaq.github.io/' }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download IndexNow payload
        uses: actions/download-artifact@v5
        with:
          name: indexnow-payload
          path: ${{ runner.temp }}/indexnow

      - name: Notify IndexNow after deployment
        working-directory: engine
        run: node scripts/indexnow.mjs submit --input "$RUNNER_TEMP/indexnow/indexnow-payload.json"

      - name: Submit sitemaps to Google Search Console
        working-directory: engine
        run: node tools/blogctl/search/node/cli.mjs submit --providers google --optional-google --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL"
