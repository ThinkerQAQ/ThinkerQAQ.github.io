name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_sha:
        description: Optional private content commit to deploy
        required: false
        type: string
      content_before_sha:
        description: Optional previous private content commit for incremental AI Search sync
        required: false
        type: string
      force_full_ai_search_sync:
        description: Explicitly allow a full AI Search reconcile when no incremental base is available
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ASK_BLOG_WORKER_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev/chat' }}
      PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_ASK_BLOG_TURNSTILE_SITE_KEY }}
      PUBLIC_REACTION_WORKER_URL: ${{ vars.PUBLIC_REACTION_WORKER_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      PUBLIC_UMAMI_PROXY_ORIGIN: ${{ vars.PUBLIC_UMAMI_PROXY_ORIGIN || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev' }}
      CONTENT_REPOSITORY: ${{ github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && 'ThinkerQAQ/blog-content' || vars.CONTENT_REPOSITORY }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine
          fetch-depth: 2

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ inputs.content_sha || '' }}
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          # Keep the read-only deploy-key credential available for the later
          # incremental diff fetch of content_before_sha in this same job.
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.work
          cache: false

      - name: Build BlogCTL
        working-directory: engine/tools/blogctl
        run: go build -o "$RUNNER_TEMP/blogctl" ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk libnspr4 libnss3 libasound2t64

      # Ubuntu runners restrict Chromium's user-namespace sandbox. The renderer
      # operates only during this ephemeral CI build, not on visitor requests.
      - name: Configure Mermaid headless Chromium for CI
        run: |
          printf '%s\\n' '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/mermaid-puppeteer.json"
          echo "MERMAID_PUPPETEER_CONFIG_FILE=$RUNNER_TEMP/mermaid-puppeteer.json" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: engine
        run: '"$RUNNER_TEMP/blogctl" site build --content-root ../content-source'

      - name: Prepare AI Search input
        continue-on-error: true
        working-directory: engine
        env:
          CONTENT_SHA: ${{ inputs.content_sha || '' }}
          CONTENT_BEFORE_SHA: ${{ inputs.content_before_sha || '' }}
          AI_SEARCH_FORCE_FULL_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
        run: '"$RUNNER_TEMP/blogctl" ai-search prepare --output "$RUNNER_TEMP/ai-search-input" --content-root ../content-source'

      - name: Upload public AI Search input
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-input
          path: ${{ runner.temp }}/ai-search-input
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: engine/dist

      - name: Upload EdgeOne artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-dist
          path: engine/dist
          if-no-files-found: error
          retention-days: 1

  deploy-edgeone:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download EdgeOne artifact
        uses: actions/download-artifact@v5
        with:
          name: edgeone-dist
          path: dist

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx edgeone makers deploy ./dist -n thinkerqaq-blog-static -t "$EDGEONE_API_TOKEN" -e production

  deploy:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy-edgeone
    continue-on-error: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_SEARCH_INSTANCE: ${{ vars.CLOUDFLARE_AI_SEARCH_INSTANCE }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      AI_SEARCH_REQUEST_TIMEOUT_MS: 120000
      AI_SEARCH_CHANGE_MANIFEST: ${{ github.workspace }}/engine/src/content/ai-search-changed-paths.txt
      AI_SEARCH_FORCE_FULL_SYNC: ${{ inputs.force_full_ai_search_sync == true && '1' || '0' }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.work
          cache: false

      - name: Build BlogCTL
        working-directory: engine/tools/blogctl
        run: go build -o "$RUNNER_TEMP/blogctl" ./cmd

      - name: Download public AI Search input
        uses: actions/download-artifact@v5
        with:
          name: ai-search-input
          path: engine/src/content

      - name: Sync and verify AI Search
        working-directory: engine
        run: '"$RUNNER_TEMP/blogctl" ai-search sync --verify'

  notify-search:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    needs: deploy-edgeone
    continue-on-error: true
    env:
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:thinkerqaq.com' }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: engine

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.work
          cache: false

      - name: Build BlogCTL
        working-directory: engine/tools/blogctl
        run: go build -o "$RUNNER_TEMP/blogctl" ./cmd

      - name: Notify search engines
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail

          args=(search notify --site-url "$GOOGLE_SEARCH_CONSOLE_SITE_URL")
          if [[ -n "${GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            credentials="$RUNNER_TEMP/google-search-console-service-account.json"
            umask 077
            printf '%s' "$GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON" > "$credentials"
            args+=(--google-service-account-file "$credentials")
          fi

          "$RUNNER_TEMP/blogctl" "${args[@]}"

  record-content-state:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io' && inputs.content_sha != ''
    runs-on: ubuntu-latest
    needs: deploy-edgeone
    permissions:
      contents: write
    env:
      CONTENT_SHA: ${{ inputs.content_sha }}
    steps:
      - name: Checkout public engine
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record successfully deployed content SHA
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deployment-state >/dev/null 2>&1; then
            git fetch --quiet origin deployment-state
            git switch --force-create deployment-state origin/deployment-state
          else
            git switch --orphan deployment-state
            git rm -rf --ignore-unmatch .
          fi

          mkdir -p deploy-state
          printf '%s\n' "$CONTENT_SHA" > deploy-state/content-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > deploy-state/run-id.txt

          git add deploy-state/content-sha.txt deploy-state/run-id.txt

          if git diff --cached --quiet; then
            echo "Deployment state already records $CONTENT_SHA"
            exit 0
          fi

          git commit -m "chore: record deployed blog content $CONTENT_SHA"
          git push origin HEAD:deployment-state
