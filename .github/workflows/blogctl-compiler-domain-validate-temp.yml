name: Temp BlogCTL Compiler Domain Validation

# Branch-only validation; removed after the domain migration is green.

on:
  push:
    branches:
      - refactor/blogctl-compiler-domain-go-20261002

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l tools/blogctl)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Test BlogCTL Go
        run: go test ./tools/blogctl/...

      - name: Install Node dependencies
        run: npm ci

      - name: Test renderer boundary
        run: npm run test:distribute

      - name: Test Go compiler integration
        run: BLOGCTL_COMPILER_INTEGRATION=1 go test ./tools/blogctl/compiler -run TestServiceCompilesThroughNodeRenderer -count=1

      - name: Test Go PlantUML integration
        run: BLOGCTL_PLANTUML_INTEGRATION=1 go test ./tools/blogctl/assets -run TestPipelineRendersPlantUMLThroughTeaVM -count=1

      - name: Test diagrams
        run: |
          npm run assemble:fixtures
          npm run test:diagrams

      - name: Test BlogCTL extension
        run: npm run test:blogctl-extension

      - name: Build BlogCTL
        run: go build ./tools/blogctl/cmd
