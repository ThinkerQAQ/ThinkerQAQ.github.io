name: Temporary BlogCTL final polish

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  polish-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace

      - name: Polish international syndication code
        shell: python
        run: |
          from pathlib import Path

          # Normalize tabs introduced by the temporary patching workflows.
          for name in [
              'scripts/syndicate.mjs',
              'scripts/medium.mjs',
          ]:
              path = Path(name)
              path.write_text(path.read_text().replace('\t', '  '))

          path = Path('scripts/syndicate-medium.mjs')
          text = path.read_text()
          old = '''    const fallbackPath = await writeMediumCopyHtml(item.article, {
          slug: item.slug,
          outputRoot,
          publishingConfig,
        });'''.replace('          ', '')
          new = '''    const fallbackPath = await writeMediumCopyHtml(item.article, {
              slug: item.slug,
              outputRoot,
              publishingConfig,
            });'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Medium fallback formatting block not found')
          path.write_text(text.replace(old, new, 1))

          # When native canonical is disabled, only reuse a DEV.to article whose
          # canonical is also empty. A same-title article with another canonical
          # must not be hijacked.
          path = Path('scripts/syndicate.mjs')
          text = path.read_text()
          start = text.find('  const existing = remoteArticles.find(', text.find('export async function upsertDevtoArticle('))
          end = text.find('  if (!existing) {', start)
          if start < 0 or end < 0:
              raise SystemExit('DEV.to lookup boundaries not found')
          lookup = '''  const existing = remoteArticles.find((article) => (
            desired.canonical_url && canonicalUrlsEqual(article.canonical_url, desired.canonical_url)
          )) ?? (!desired.canonical_url
            ? remoteArticles.find((article) => (
                !String(article.canonical_url || "").trim()
                && article.title === desired.title
              ))
            : undefined);
          '''.replace('          ', '')
          text = text[:start] + lookup + text[end:]
          path.write_text(text)

          path = Path('scripts/syndicate.test.mjs')
          text = path.read_text().replace('\n\ntest("DEV.to publishing profile', '\ntest("DEV.to publishing profile', 1)
          marker = 'test("canonical comparison ignores query, hash and trailing slash", () => {'
          addition = r'''
          test("DEV.to no-canonical fallback does not hijack a same-title article with another canonical", async () => {
            const desired = buildDevtoArticle({
              title: "Test", description: "Description", tags: ["Go"], body: "Body", status: "published",
            }, {
              slug: "test",
              publishingConfig: {
                footer: { enabled: false, template: "" },
                canonical: { mode: "none" },
                tracking: { enabled: false, source: "devto", medium: "referral", campaign: "article_syndication" },
              },
            });
            const remoteArticles = [{
              id: 9,
              title: "Test",
              canonical_url: "https://example.com/a-different-article/",
            }];
            const calls = [];
            const result = await upsertDevtoArticle(desired, {
              apiKey: "key",
              remoteArticles,
              fetchImpl: async (url, init) => {
                calls.push({ url, init });
                return new Response(JSON.stringify({ id: 10, url: "https://dev.to/user/test", ...desired }), { status: 201 });
              },
            });
            assert.equal(result.action, "created");
            assert.deepEqual(calls.map((call) => call.init.method), ["POST"]);
          });

          '''.replace('          ', '')
          if 'does not hijack a same-title article' not in text:
              if marker not in text:
                  raise SystemExit('DEV.to regression test marker not found')
              text = text.replace(marker, addition + marker, 1)
          path.write_text(text)

      - name: Check legacy publishing fields are isolated
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -R -n -E 'footerEnabled|footerTemplate|trackingQuery' scripts tools/blogctl \
            --include='*.mjs' --include='*.js' --include='*.go' \
            | grep -v 'scripts/publishing-config.mjs' \
            | grep -v 'scripts/publishing-config.test.mjs' \
            | grep -v 'tools/blogctl/bridge/config.go' \
            | grep -v 'tools/blogctl/bridge/config_test.go' || true)"
          if [ -n "$hits" ]; then
            echo "Legacy publishing fields escaped migration-only files:"
            printf '%s\n' "$hits"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - name: Check BlogCTL formatting
        working-directory: tools/blogctl
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following BlogCTL files need gofmt:"
            printf '%s\n' "$files"
            gofmt -d $files
            exit 1
          fi

      - name: Test BlogCTL
        working-directory: tools/blogctl
        run: go test ./...

      - name: Build BlogCTL
        working-directory: tools/blogctl
        run: go build -o "$RUNNER_TEMP/blogctl" ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Assemble synthetic content
        run: npm run assemble:fixtures

      - name: Test public engine
        run: npm run test:engine

      - name: Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Commit polish after full validation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/syndicate.mjs scripts/syndicate.test.mjs scripts/medium.mjs scripts/syndicate-medium.mjs
          git commit -m "refactor: polish publishing profile syndication"
          git push origin HEAD:refactor/blogctl-content-workspace
