name: Temporary BlogCTL Refactor Validation

on:
  push:
    branches:
      - docs/blogctl-go-runtime-ci-refactor-20261001

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/blogctl-go-runtime-ci-refactor-20261001
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Go sources
        run: |
          gofmt -w tools/blogctl
          if ! git diff --quiet -- tools/blogctl; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/blogctl
            git commit -m "style(blogctl): gofmt refactor"
            git push origin HEAD:docs/blogctl-go-runtime-ci-refactor-20261001
          fi
      - name: Test BlogCTL Go packages
        run: go test ./tools/blogctl/...
      - name: Smoke-test content assembly
        run: go run ./tools/blogctl/cmd site assemble --content-root fixtures
      - name: Check JavaScript boundaries
        run: |
          node --check tools/blogctl/renderers/node/markdown-html.mjs
          node --check tools/blogctl/renderers/node/publishing-image.mjs
          node --check tools/blogctl/extension/background.js
