name: Release blogctl

on:
  push:
    branches: [main]
    paths:
      - "tools/blogctl/**"
      - ".github/workflows/blogctl-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogctl-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < tools/blogctl/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tools/blogctl/VERSION: $version"
            exit 1
          fi
          tag="blogctl-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test blogctl
        if: steps.version.outputs.exists != 'true'
        working-directory: tools/blogctl
        run: go test ./...

      - name: Build cross-platform binaries
        if: steps.version.outputs.exists != 'true'
        working-directory: tools/blogctl
        run: |
          set -euo pipefail
          mkdir -p ../../dist/blogctl-release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-windows-amd64.exe ./cmd
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-windows-arm64.exe ./cmd
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-darwin-amd64 ./cmd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-darwin-arm64 ./cmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-linux-amd64 ./cmd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../../dist/blogctl-release/blogctl-linux-arm64 ./cmd

      - name: Package browser extension
        if: steps.version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/blogctl-release
          (
            cd tools/blogctl/extension
            zip -qr ../../../dist/blogctl-release/blogctl-extension.zip .
          )

      - name: Package native host installers
        if: steps.version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cp tools/blogctl/Install-Windows.ps1 dist/blogctl-release/
          cp tools/blogctl/Uninstall-Windows.ps1 dist/blogctl-release/
          cp tools/blogctl/Install-Linux.sh dist/blogctl-release/
          cp tools/blogctl/Uninstall-Linux.sh dist/blogctl-release/
          cp tools/blogctl/Install-macOS.command dist/blogctl-release/
          cp tools/blogctl/Uninstall-macOS.command dist/blogctl-release/

      - name: Generate checksums
        if: steps.version.outputs.exists != 'true'
        working-directory: dist/blogctl-release
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/blogctl-release/* \
            --target "$GITHUB_SHA" \
            --title "blogctl v${VERSION}" \
            --notes "Cross-platform ThinkerQAQ blog developer tool. Includes Windows, macOS, and Linux binaries, Native Messaging installers, and the matching browser extension."
