name: Release blogctl

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "tools/blogctl/**"
      - ".devtool.toml"
      - ".github/workflows/blogctl-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogctl-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEVTOOL_VERSION: 03540c8e134b1d2913b52d74ce079857c19ea12f
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install DevTool V2
        run: |
          GOPROXY=direct go install github.com/thinkerqaq/devtool/cmd/devtool@${DEVTOOL_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate DevTool configuration
        run: devtool config validate

      - name: Inspect BlogCTL project extension
        run: devtool project inspect --json

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < tools/blogctl/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tools/blogctl/VERSION: $version"
            exit 1
          fi
          tag="blogctl-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify BlogCTL
        if: steps.version.outputs.exists != 'true'
        run: devtool verify

      - name: Package BlogCTL
        if: steps.version.outputs.exists != 'true'
        run: devtool package

      - name: Publish GitHub Release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" .devtool/artifacts/blogctl-release/* \
            --target "$GITHUB_SHA" \
            --title "blogctl v${VERSION}" \
            --notes-file tools/blogctl/RELEASE_NOTES.md

      - name: Refresh current release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --title "blogctl v${VERSION}" \
            --notes-file tools/blogctl/RELEASE_NOTES.md

      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$TAG" ]] && continue
            echo "Deleting superseded release: $old_tag"
            gh release delete "$old_tag" --yes
          done

