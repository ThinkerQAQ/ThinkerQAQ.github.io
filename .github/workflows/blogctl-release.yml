name: Release blogctl

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "tools/blogctl/**"
      - ".github/workflows/blogctl-release.yml"
      - ".github/workflows/blogctl-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogctl-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: tools/blogctl/go.sum

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < tools/blogctl/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tools/blogctl/VERSION: $version"
            exit 1
          fi
          tag="blogctl-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify BlogCTL
        if: steps.version.outputs.exists != 'true'
        run: go run ./tools/blogctl/cmd/maint verify

      - name: Verify dependency redistribution permissions
        if: steps.version.outputs.exists != 'true'
        run: |
          mkdir -p .build/tools
          GOTOOLCHAIN="$(go env GOVERSION)" GOBIN="$PWD/.build/tools" go install github.com/google/go-licenses/v2@v2.0.1
          bash scripts/collect-blogctl-licenses.sh

      - name: Package BlogCTL
        if: steps.version.outputs.exists != 'true'
        run: go run ./tools/blogctl/cmd/maint package

      - name: Publish GitHub Release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" .build/artifacts/blogctl-release/* \
            --target "$GITHUB_SHA" \
            --title "blogctl v${VERSION}" \
            --notes-file tools/blogctl/RELEASE_NOTES.md

      - name: Refresh current release notes
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --title "blogctl v${VERSION}" \
            --notes-file tools/blogctl/RELEASE_NOTES.md
