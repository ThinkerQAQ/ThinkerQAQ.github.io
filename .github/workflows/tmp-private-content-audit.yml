name: Temporary private content privacy audit

on:
  push:
    branches:
      - security/public-content-and-analytics-minimization
    paths:
      - ".github/workflows/tmp-private-content-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine branch
        uses: actions/checkout@v6

      - name: Checkout private content
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/blog-content
          ssh-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}
          path: content-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit private content before publication
        run: node scripts/assert-public-content-safety.mjs content-source/src/content --require-root
