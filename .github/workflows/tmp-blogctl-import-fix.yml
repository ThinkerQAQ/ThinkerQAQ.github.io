name: Temporary BlogCTL import fix

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace
      - name: Remove stale import and format
        shell: bash
        run: |
          sed -i '/^[[:space:]]*"encoding\/json"$/d' tools/blogctl/bridge/control.go
          gofmt -w tools/blogctl/bridge/control.go
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/bridge/control.go
          git commit -m "fix: remove stale BlogCTL bridge import"
          git push origin HEAD:refactor/blogctl-content-workspace
