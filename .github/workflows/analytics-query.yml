name: Query blog analytics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics-query.yml"
      - "workers/blog-ai/src/analytics.js"
      - "workers/blog-ai/src/bot-observation.js"
      - "workers/blog-ai/src/worker.js"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional Asia/Shanghai start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional Asia/Shanghai end date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: analytics-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_READ_TOKEN: ${{ secrets.CLOUDFLARE_KV_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_SEARCH_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Query production analytics from Workers KV
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = await import("node:fs");

          const HOUR_MS = 60 * 60 * 1000;
          const HEALTH_GRACE_MS = 15 * 60 * 1000;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const tokenCandidates = [
            ["CLOUDFLARE_KV_READ_TOKEN", process.env.CLOUDFLARE_KV_READ_TOKEN],
            ["CLOUDFLARE_API_TOKEN", process.env.CLOUDFLARE_API_TOKEN],
            ["CLOUDFLARE_AI_SEARCH_TOKEN", process.env.CLOUDFLARE_AI_SEARCH_TOKEN],
          ];
          const [tokenSource, apiToken] =
            tokenCandidates.find(([, value]) => Boolean(value)) || [];
          const startDate = (process.env.START_DATE || "").trim();
          const endDate = (process.env.END_DATE || "").trim();

          if (!accountId || !apiToken) {
            throw new Error(
              "Cloudflare account/token is required for query-only KV access. Configure CLOUDFLARE_KV_READ_TOKEN with Account.Workers KV Storage:Read.",
            );
          }
          console.log(`Using Cloudflare token source: ${tokenSource}`);

          const wrangler = fs.readFileSync("workers/blog-ai/wrangler.jsonc", "utf8");
          const namespaceMatch = wrangler.match(
            /"binding"\s*:\s*"ANALYTICS_KV"[\s\S]{0,300}?"id"\s*:\s*"([^"]+)"/,
          );
          if (!namespaceMatch) {
            throw new Error("Could not resolve ANALYTICS_KV namespace id from wrangler.jsonc.");
          }
          const namespaceId = namespaceMatch[1];

          async function kvGet(key, { required = true } = {}) {
            const url =
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              `/storage/kv/namespaces/${encodeURIComponent(namespaceId)}` +
              `/values/${encodeURIComponent(key)}`;
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${apiToken}` },
            });
            if (response.status === 404 && !required) return null;
            if (!response.ok) {
              const detail = await response.text().catch(() => "");
              const permissionHint =
                response.status === 401 || response.status === 403
                  ? " Ensure the selected token is valid for this account and has Workers KV Storage:Read."
                  : "";
              throw new Error(
                `KV read failed for ${key}: ${response.status}${detail ? ` ${detail.slice(0, 200)}` : ""}.${permissionHint}`,
              );
            }
            const text = await response.text();
            return text ? JSON.parse(text) : null;
          }

          function floorHour(timestamp) {
            return Math.floor(timestamp / HOUR_MS) * HOUR_MS;
          }

          function pendingHours(lastFinalizedHourEnd, now, graceMs = 0) {
            if (!Number.isFinite(lastFinalizedHourEnd)) return null;
            const expectedHourEnd = floorHour(now - graceMs);
            return Math.max(
              0,
              Math.floor((expectedHourEnd - lastFinalizedHourEnd) / HOUR_MS),
            );
          }

          const take = (value, limit = 50) =>
            Array.isArray(value) ? value.slice(0, limit) : [];

          const trimWindow = window => ({
            ...(window?.date ? { date: window.date } : {}),
            ...(window?.weekStartDate ? { weekStartDate: window.weekStartDate } : {}),
            ...(Number.isFinite(window?.timezoneOffsetMinutes)
              ? { timezoneOffsetMinutes: window.timezoneOffsetMinutes }
              : {}),
            startAt: window?.startAt,
            endAt: window?.endAt,
            stats: window?.stats,
            paths: take(window?.paths),
            entryPages: take(window?.entryPages),
            referrers: take(window?.referrers),
            channels: take(window?.channels),
            countries: take(window?.countries),
            events: take(window?.events),
            utmSources: take(window?.utmSources),
            warnings: take(window?.warnings),
          });

          const trimDelta = delta => {
            if (!delta) return delta;
            const result = { stats: delta.stats };
            for (const [key, value] of Object.entries(delta)) {
              if (key === "stats") continue;
              if (/Regions$|Cities$/.test(key)) continue;
              if (Array.isArray(value)) result[key] = value.slice(0, 50);
            }
            return result;
          };

          function parseDate(value, label) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
              throw new Error(`${label} must use YYYY-MM-DD`);
            }
            const timestamp = Date.parse(`${value}T00:00:00Z`);
            if (!Number.isFinite(timestamp)) throw new Error(`${label} is invalid`);
            return timestamp;
          }

          async function loadDateRange() {
            if (!startDate && !endDate) return null;
            if (!startDate || !endDate) {
              throw new Error("start_date and end_date must be supplied together");
            }
            const start = parseDate(startDate, "start_date");
            const end = parseDate(endDate, "end_date");
            if (end < start) throw new Error("end_date must be on or after start_date");
            const dayCount = Math.floor((end - start) / 86400000) + 1;
            if (dayCount > 31) throw new Error("date range is limited to 31 days");

            const days = [];
            for (let ts = start; ts <= end; ts += 86400000) {
              const date = new Date(ts).toISOString().slice(0, 10);
              const value = await kvGet(`analytics:day:${date}`, { required: false });
              days.push({
                date,
                available: Boolean(value),
                ...(value ? { data: trimWindow(value) } : {}),
              });
            }
            return { startDate, endDate, days };
          }

          const shanghaiDate = new Date(Date.now() + 8 * 60 * 60 * 1000)
            .toISOString()
            .slice(0, 10);

          const [meta, hourly, today, daily, weekly, botObservation, dateRange] =
            await Promise.all([
              kvGet("analytics:meta"),
              kvGet("analytics:latest"),
              kvGet(`analytics:today:${shanghaiDate}`, { required: false }),
              kvGet("analytics:daily:latest", { required: false }),
              kvGet("analytics:weekly:latest"),
              kvGet("analytics:bot:latest", { required: false }),
              loadDateRange(),
            ]);

          const now = Date.now();
          const pending = pendingHours(
            Number(meta?.lastFinalizedHourEnd),
            now,
            HEALTH_GRACE_MS,
          );
          const lastSuccessMs = Date.parse(meta?.lastSuccessAt || "");
          const health = {
            healthy:
              !meta?.lastError &&
              pending === 0 &&
              Number.isFinite(lastSuccessMs) &&
              now - lastSuccessMs < 2 * HOUR_MS,
            now: new Date(now).toISOString(),
            lastSuccessAt: meta?.lastSuccessAt || null,
            pendingHours: pending,
            hasError: Boolean(meta?.lastError),
          };

          if (
            health.healthy !== true ||
            !health.lastSuccessAt ||
            health.pendingHours !== 0 ||
            health.hasError === true
          ) {
            throw new Error(`analytics health check failed: ${JSON.stringify(health)}`);
          }

          if (!hourly?.generatedAt || !hourly.current?.stats || !hourly.previous?.stats) {
            throw new Error("analytics:latest is missing persisted current/previous windows");
          }

          if (!weekly?.generatedAt || !weekly.current?.stats || !weekly.previous?.stats) {
            throw new Error("analytics:weekly:latest is missing two complete calendar weeks");
          }

          const result = {
            queriedAt: new Date().toISOString(),
            health,
            hourly: {
              generatedAt: hourly.generatedAt,
              windowHours: hourly.windowHours,
              current: trimWindow(hourly.current),
              previous: trimWindow(hourly.previous),
              delta: trimDelta(hourly.delta),
            },
            today: today
              ? {
                  generatedAt: today.generatedAt,
                  date: today.date,
                  timezoneOffsetMinutes: today.timezoneOffsetMinutes,
                  current: trimWindow(today.current),
                }
              : null,
            daily: daily
              ? {
                  generatedAt: daily.generatedAt,
                  timezoneOffsetMinutes: daily.timezoneOffsetMinutes,
                  current: trimWindow(daily.current),
                  previous: trimWindow(daily.previous),
                  delta: trimDelta(daily.delta),
                }
              : null,
            dateRange,
            weekly: {
              generatedAt: weekly.generatedAt,
              timezoneOffsetMinutes: weekly.timezoneOffsetMinutes,
              current: trimWindow(weekly.current),
              previous: trimWindow(weekly.previous),
              delta: trimDelta(weekly.delta),
            },
            botObservation: botObservation
              ? {
                  generatedAt: botObservation.generatedAt,
                  windowHours: botObservation.windowHours,
                  clientsObserved: botObservation.clientsObserved,
                  suspectedClients: botObservation.suspectedClients,
                  totalObservedPageviews: botObservation.totalObservedPageviews,
                  blockedHits: botObservation.blockedHits,
                  largestClientPageviewShare: botObservation.largestClientPageviewShare,
                  dominantSingleClient: botObservation.dominantSingleClient,
                  distributedScanCohorts: botObservation.distributedScanCohorts,
                  distributedBlockedHits: botObservation.distributedBlockedHits,
                  topDistributedSuspects: take(botObservation.topDistributedSuspects, 10),
                  topSuspected: take(botObservation.topSuspected, 10),
                }
              : null,
          };

          console.log(`ANALYTICS_QUERY_RESULT=${JSON.stringify(result)}`);
          NODE
