name: Query blog analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics-query.yml"
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read

concurrency:
  group: analytics-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANALYTICS_BASE_URL: ${{ vars.PUBLIC_ASK_BLOG_WORKER_URL || 'https://thinkerqaq-blog-ai.blog-ai.workers.dev/chat' }}
    steps:
      - name: Query production analytics
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          const origin = new URL(process.env.ANALYTICS_BASE_URL).origin;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getJson(path) {
            const response = await fetch(origin + path, {
              headers: { accept: "application/json" },
            });
            if (!response.ok) {
              const detail = await response.text().catch(() => "");
              throw new Error(
                `${path} returned ${response.status}${detail ? ` ${detail.slice(0, 200)}` : ""}`,
              );
            }
            return response.json();
          }

          async function loadReports() {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const reports = await Promise.all([
                  getJson("/analytics/health"),
                  getJson("/analytics/hourly"),
                  getJson("/analytics/weekly"),
                  getJson("/analytics/bot-observation"),
                ]);
                if (reports[2]?.available === false) {
                  throw new Error("weekly analytics are not available yet");
                }
                return reports;
              } catch (error) {
                lastError = error;
                if (attempt === 12) break;
                console.log(
                  `Analytics endpoint attempt ${attempt}/12 failed: ${error instanceof Error ? error.message : String(error)}; retrying in 5s`,
                );
                await sleep(5000);
              }
            }
            throw lastError;
          }

          const [health, hourly, weekly, botObservation] = await loadReports();

          if (
            health.healthy !== true ||
            !health.lastSuccessAt ||
            health.pendingHours !== 0 ||
            health.hasError === true
          ) {
            throw new Error(`analytics health check failed: ${JSON.stringify(health)}`);
          }
          if (!hourly?.generatedAt || !hourly.current?.stats || !hourly.previous?.stats) {
            throw new Error("analytics/hourly is missing current/previous windows");
          }
          if (!weekly?.generatedAt || !weekly.current?.stats || !weekly.previous?.stats) {
            throw new Error("analytics/weekly is missing two complete calendar weeks");
          }

          const take = (value, limit = 50) =>
            Array.isArray(value) ? value.slice(0, limit) : [];

          const result = {
            queriedAt: new Date().toISOString(),
            health,
            hourly: {
              ...hourly,
              current: { ...hourly.current, paths: take(hourly.current.paths), entryPages: take(hourly.current.entryPages), referrers: take(hourly.current.referrers), channels: take(hourly.current.channels), countries: take(hourly.current.countries), events: take(hourly.current.events), utmSources: take(hourly.current.utmSources), warnings: take(hourly.current.warnings) },
              previous: { ...hourly.previous, paths: take(hourly.previous.paths), entryPages: take(hourly.previous.entryPages), referrers: take(hourly.previous.referrers), channels: take(hourly.previous.channels), countries: take(hourly.previous.countries), events: take(hourly.previous.events), utmSources: take(hourly.previous.utmSources), warnings: take(hourly.previous.warnings) },
            },
            weekly: {
              ...weekly,
              current: { ...weekly.current, paths: take(weekly.current.paths), entryPages: take(weekly.current.entryPages), referrers: take(weekly.current.referrers), channels: take(weekly.current.channels), countries: take(weekly.current.countries), events: take(weekly.current.events), utmSources: take(weekly.current.utmSources), warnings: take(weekly.current.warnings) },
              previous: { ...weekly.previous, paths: take(weekly.previous.paths), entryPages: take(weekly.previous.entryPages), referrers: take(weekly.previous.referrers), channels: take(weekly.previous.channels), countries: take(weekly.previous.countries), events: take(weekly.previous.events), utmSources: take(weekly.previous.utmSources), warnings: take(weekly.previous.warnings) },
            },
            botObservation: botObservation
              ? {
                  ...botObservation,
                  topDistributedSuspects: take(botObservation.topDistributedSuspects, 10),
                  topSuspected: take(botObservation.topSuspected, 10),
                }
              : null,
          };

          console.log(`ANALYTICS_QUERY_RESULT=${JSON.stringify(result)}`);
          NODE
