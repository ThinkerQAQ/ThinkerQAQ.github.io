name: Probe EdgeOne preview proxy

on:
  push:
    branches: [perf/umami-async-edgeone-proxy-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'ThinkerQAQ/ThinkerQAQ.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare minimal preview artifact
        run: |
          mkdir -p preview-dist
          cp -R edge-functions preview-dist/edge-functions
          printf '%s\n' '<!doctype html><title>EdgeOne preview connectivity probe</title>' > preview-dist/index.html

      - name: Deploy only to Makers preview
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PAGES_SOURCE: skills
        run: |
          test -n "$EDGEONE_API_TOKEN" || { echo 'EDGEONE_API_TOKEN is not set'; exit 1; }
          npx edgeone makers deploy ./preview-dist -n thinkerqaq-blog-static -t "$EDGEONE_API_TOKEN" -e preview --json
