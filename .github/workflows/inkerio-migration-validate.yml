name: Validate pinned Inkerio website integration

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/inkerio-migration-validate.yml"
      - "scripts/prepare-inkerio-deployment.mjs"
      - "scripts/prepare-inkerio-deployment.test.mjs"
      - "site.config.json"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-inkerio-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout site integration
        uses: actions/checkout@v6
        with:
          path: legacy

      - name: Checkout pinned independent Inkerio
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/inkerio
          ref: 31dad0ddccee09b188deb3fe915dfec51cfcf2ea
          path: engine
          persist-credentials: false

      - name: Checkout public content template
        uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/inkerio-content-template
          path: content-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram and browser dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk libnspr4 libnss3 libasound2t64

      - name: Configure headless Mermaid
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/mermaid-puppeteer.json"
          echo "MERMAID_PUPPETEER_CONFIG_FILE=$RUNNER_TEMP/mermaid-puppeteer.json" >> "$GITHUB_ENV"

      - name: Check site integration boundaries
        run: node --test legacy/scripts/prepare-inkerio-deployment.test.mjs

      - name: Prepare public site overlay
        run: node legacy/scripts/prepare-inkerio-deployment.mjs --engine engine --site legacy

      - name: Build engine with public content template
        working-directory: engine
        run: |
          npm ci
          node scripts/assemble-content.mjs --content-root ../content-source
          npm run check
          npm run build

      - name: Verify generated static output without publishing
        working-directory: engine
        run: |
          test -s dist/index.html
          test -s dist/en/index.html
          test -s dist/sitemap-all.txt
          test -s dist/sitemap-inventory.json
          test -s dist/rss.xml
          test -s dist/pagefind/pagefind-entry.json
          test -s dist/gongan-beian.png
          test -s dist/favicon.ico
          grep -q 'thinkerqaq.com' dist/index.html
          grep -q 'ThinkerQAQ' dist/index.html
          grep -q '粤ICP备' dist/index.html
          echo "Standalone deployment wrapper validated against public template, no private content read."
