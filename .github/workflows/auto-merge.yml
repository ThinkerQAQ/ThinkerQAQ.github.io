name: Auto merge validated pull requests

on:
  workflow_run:
    workflows: ["Validate pull requests"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
      VALIDATED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Verify exact validated PR is still eligible
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" || "$PR_NUMBER" == "null" ]]; then
            echo "No pull request is associated with this validation run."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          base="$(jq -r '.base.ref' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          author="$(jq -r '.user.login' <<<"$pr")"
          owner="${REPO%%/*}"
          current_master="$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')"

          if [[ "$state" != "open" || "$draft" != "false" || "$base" != "master" ]]; then
            echo "PR is not an open, non-draft PR targeting master."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_repo" != "$REPO" || "$author" != "$owner" ]]; then
            echo "PR is not an internal repository-owner PR; automatic merge is disabled."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_sha" != "$VALIDATED_SHA" ]]; then
            echo "PR head moved after validation; a new validation run must pass first."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${VALIDATED_BASE_SHA:-}" || "$VALIDATED_BASE_SHA" == "null" || "$base_sha" != "$VALIDATED_BASE_SHA" || "$current_master" != "$VALIDATED_BASE_SHA" ]]; then
            echo "master moved after validation; revalidate the PR before merging."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "before_sha=$current_master" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Squash merge validated PR
        if: steps.guard.outputs.eligible == 'true'
        env:
          BEFORE_SHA: ${{ steps.guard.outputs.before_sha }}
        run: |
          set -euo pipefail
          current_master="$(gh api "repos/$REPO/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$current_master" != "$BEFORE_SHA" ]]; then
            echo "master moved between validation and merge; refusing to merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            --match-head-commit "$VALIDATED_SHA"

      - name: Dispatch production deployment
        if: steps.guard.outputs.eligible == 'true'
        env:
          BEFORE_SHA: ${{ steps.guard.outputs.before_sha }}
        run: gh workflow run deploy.yml --repo "$REPO" --ref master -f before_sha="$BEFORE_SHA"
