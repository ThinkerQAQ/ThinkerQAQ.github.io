name: Syndicate international content

on:
  workflow_dispatch:
    inputs:
      article:
        description: English article slug to sync
        required: true
        type: string
      dry_run:
        description: Validate payloads without calling DEV.to
        required: false
        default: false
        type: boolean
      draft:
        description: Create or update the DEV.to article as a draft instead of publishing it
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: international-syndication
  cancel-in-progress: false

jobs:
  devto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test syndication logic
        run: npm run test:syndicate

      - name: Syndicate explicitly selected English article to DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ARTICLE: ${{ inputs.article }}
          DRY_RUN: ${{ inputs.dry_run }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [[ -z "${ARTICLE:-}" ]]; then
            echo "::error::An explicit article slug is required. Automatic or implicit all-article syndication is disabled."
            exit 1
          fi

          args=(--platforms devto --article "$ARTICLE")
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${DRAFT:-false}" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ -z "${DEVTO_API_KEY:-}" && "${DRY_RUN:-false}" != "true" ]]; then
            echo "::notice::DEVTO_API_KEY is not configured; international syndication is skipped."
            exit 0
          fi

          npm run syndicate -- "${args[@]}"
