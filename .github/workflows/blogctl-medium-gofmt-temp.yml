name: Temp BlogCTL Medium Gofmt

on:
  push:
    branches:
      - refactor/blogctl-medium-go-backend-20261002

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false
      - name: Format Medium backend cleanup
        run: |
          gofmt -w tools/blogctl/bridge/server.go tools/blogctl/bridge/medium_bindings.go tools/blogctl/bridge/server_test.go
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/bridge
          git commit -m "style(medium): gofmt backend cleanup"
          git push
