name: Temporary BlogCTL shared sync wiring

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace
      - name: Wire Bridge to shared application service
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/blogctl/bridge/control.go')
          text = path.read_text()

          marker = '\t"time"\n)'
          replacement = '\t"time"\n\n\tblogapp "github.com/ThinkerQAQ/ThinkerQAQ.github.io/tools/blogctl/app"\n)'
          if marker not in text:
              raise SystemExit('import marker not found')
          text = text.replace(marker, replacement, 1)

          old_normalize = '''func normalizeSyncRequest(request syncRequest) (syncRequest, error) {
          \trequest.Article = strings.TrimSpace(request.Article)
          \tif request.Article == "" {
          \t\treturn request, errors.New("article is required")
          \t}
          \tseen := map[string]struct{}{}
          \tplatforms := make([]string, 0, len(request.Platforms))
          \tfor _, platform := range request.Platforms {
          \t\tplatform = strings.TrimSpace(strings.ToLower(platform))
          \t\tif _, ok := supportedSyncPlatforms[platform]; !ok {
          \t\t\treturn request, fmt.Errorf("unsupported platform: %s", platform)
          \t\t}
          \t\tif _, exists := seen[platform]; exists {
          \t\t\tcontinue
          \t\t}
          \t\tseen[platform] = struct{}{}
          \t\tplatforms = append(platforms, platform)
          \t}
          \tif len(platforms) == 0 {
          \t\treturn request, errors.New("at least one platform is required")
          \t}
          \trequest.Platforms = platforms
          \treturn request, nil
          }
          '''.replace('          ', '')

          new_normalize = '''func normalizeSyncRequest(request syncRequest) (syncRequest, error) {
          \tnormalized, err := blogapp.NormalizeSyncRequest(blogapp.SyncRequest{
          \t\tArticles:  []string{request.Article},
          \t\tPlatforms: request.Platforms,
          \t\tDryRun:    request.DryRun,
          \t\tChanged:   request.Changed,
          \t\tDraft:     request.Draft,
          \t})
          \tif err != nil {
          \t\treturn request, err
          \t}
          \trequest.Article = normalized.Articles[0]
          \trequest.Platforms = normalized.Platforms
          \treturn request, nil
          }
          '''.replace('          ', '')
          if old_normalize not in text:
              raise SystemExit('normalizeSyncRequest block not found')
          text = text.replace(old_normalize, new_normalize, 1)

          start = text.find('func prependToolDirectories(')
          end = text.find('func (s *Server) startSyncJob(', start)
          if start < 0 or end < 0:
              raise SystemExit('legacy sync execution block not found')

          shared = '''func (s *Server) runSyncApplication(ctx context.Context, config bridgeConfig, request syncRequest) (string, error) {
          \tapplicationConfig := blogapp.SyncConfig{
          \t\tEngineRoot:   config.EngineRoot,
          \t\tContentRoot:  config.ContentRoot,
          \t\tBridgeOrigin: "http://" + DefaultAddress,
          \t\tBridgeToken:  s.token,
          \t\tToolPaths:    config.ToolPaths,
          \t}
          \tif configPath, err := ConfigPath(); err == nil {
          \t\tapplicationConfig.ConfigPath = configPath
          \t}
          \tservice := blogapp.NewSyncService()
          \treturn service.Run(ctx, applicationConfig, blogapp.SyncRequest{
          \t\tArticles:  []string{request.Article},
          \t\tPlatforms: append([]string{}, request.Platforms...),
          \t\tDryRun:    request.DryRun,
          \t\tChanged:   request.Changed,
          \t\tDraft:     request.Draft,
          \t})
          }

          '''.replace('          ', '')
          text = text[:start] + shared + text[end:]

          old_call = 'output, err := runSyncCommand(context.Background(), config, request)'
          new_call = 'output, err := s.runSyncApplication(context.Background(), config, request)'
          if old_call not in text:
              raise SystemExit('sync job execution call not found')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text)
      - name: Format and test BlogCTL
        shell: bash
        run: |
          gofmt -w tools/blogctl
          cd tools/blogctl
          go test ./...
      - name: Commit shared sync wiring
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl
          git commit -m "refactor: share sync application service with Bridge"
          git push origin HEAD:refactor/blogctl-content-workspace
