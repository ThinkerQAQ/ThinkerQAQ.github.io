name: Temporary BlogCTL structured errors

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace

      - name: Wire structured API errors
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/blogctl/bridge/server.go")
          text = path.read_text()
          replacements = {
              'writeJSON(response, http.StatusUnauthorized, map[string]any{"error": "unauthorized"})': 'writeAPIError(response, http.StatusUnauthorized, "unauthorized", "unauthorized", nil)',
              'writeJSON(response, http.StatusBadRequest, map[string]any{"error": "valid medium session is required"})': 'writeAPIError(response, http.StatusBadRequest, "medium_session_required", "valid medium session is required", nil)',
              'writeJSON(response, http.StatusBadRequest, map[string]any{"error": "unsupported session platform"})': 'writeAPIError(response, http.StatusBadRequest, "unsupported_session_platform", "unsupported session platform", nil)',
              'writeJSON(response, http.StatusNotFound, map[string]any{"error": "platform has no status URL"})': 'writeAPIError(response, http.StatusNotFound, "platform_status_unavailable", "platform has no status URL", nil)',
              'writeJSON(response, http.StatusNotFound, map[string]any{"error": "sync job not found"})': 'writeAPIError(response, http.StatusNotFound, "sync_job_not_found", "sync job not found", map[string]any{"id": id})',
              'writeJSON(response, http.StatusNotFound, map[string]any{"error": "not found"})': 'writeAPIError(response, http.StatusNotFound, "not_found", "not found", map[string]any{"path": request.URL.Path})',
              'writeJSON(response, http.StatusMethodNotAllowed, map[string]any{"error": "method not allowed"})': 'writeAPIError(response, http.StatusMethodNotAllowed, "method_not_allowed", "method not allowed", map[string]any{"method": request.Method})',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          old = '''func writeError(response http.ResponseWriter, status int, err error) {
          \twriteJSON(response, status, map[string]any{"error": err.Error()})
          }'''.replace("          ", "")
          new = '''func writeError(response http.ResponseWriter, status int, err error) {
          \tmessage := http.StatusText(status)
          \tif err != nil && err.Error() != "" {
          \t\tmessage = err.Error()
          \t}
          \twriteAPIError(response, status, errorCodeForStatus(status), message, nil)
          }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("writeError block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Format and test Bridge
        working-directory: tools/blogctl
        run: |
          gofmt -w bridge/server.go bridge/errors.go bridge/errors_test.go
          go test ./bridge

      - name: Commit structured errors
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/bridge/server.go tools/blogctl/bridge/errors.go tools/blogctl/bridge/errors_test.go
          git commit -m "feat: expose structured BlogCTL API errors"
          git push origin HEAD:refactor/blogctl-content-workspace
