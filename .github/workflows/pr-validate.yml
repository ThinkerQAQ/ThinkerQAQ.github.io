name: Validate pull requests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Article to Note catalog
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-article-note-relations-catalog.mjs
          if git diff --quiet -- src/content/articles; then
            echo "Relation catalog already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles
          git commit -m "content: map articles to related notes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Setup Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk
      - name: Test diagrams
        run: npm run test:diagrams
      - name: Test IndexNow
        run: npm run test:indexnow
      - name: Test distribution
        run: npm run test:distribute
      - name: Test VNote import and policies
        run: npm run test:vnotes
      - name: Check AI search scripts
        run: npm run test:ai-search
      - name: Test Helpful reactions
        run: npm run test:reactions
      - name: Test reading experience
        run: npm run test:reading-experience
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify build output
        id: verify_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/verify-build.log"
      - name: Upload verify diagnostics
        if: steps.verify_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: verify-build-diagnostics
          path: ${{ runner.temp }}/verify-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when build verification fails
        if: steps.verify_build.outcome == 'failure'
        run: exit 1
