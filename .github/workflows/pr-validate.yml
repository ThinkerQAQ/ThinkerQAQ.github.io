name: Validate pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/blogctl/go.mod
          cache: false

      - name: Check BlogCTL formatting
        working-directory: tools/blogctl
        run: test -z "$(gofmt -l .)"

      - name: Test BlogCTL
        working-directory: tools/blogctl
        run: go test ./...

      - name: Build BlogCTL
        working-directory: tools/blogctl
        run: go build ./cmd

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      - name: Assemble synthetic content
        run: npm run assemble:fixtures

      - name: Test public engine
        run: npm run test:engine

      - name: Astro check
        run: npm run check

      - name: Build static site
        run: npm run build
