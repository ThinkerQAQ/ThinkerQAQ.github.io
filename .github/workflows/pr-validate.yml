name: Validate pull requests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install diagram layout and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk
      - name: Test diagrams
        run: npm run test:diagrams
      - name: Test IndexNow
        run: npm run test:indexnow
      - name: Test distribution
        run: npm run test:distribute
      - name: Test VNote import and policies
        run: npm run test:vnotes
      - name: Check AI search scripts
        run: npm run test:ai-search
      - name: Test Helpful reactions
        run: npm run test:reactions
      - name: Astro check
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify build output
        id: verify_build
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee "$RUNNER_TEMP/verify-build.log"
      - name: Upload verify diagnostics
        if: steps.verify_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: verify-build-diagnostics
          path: ${{ runner.temp }}/verify-build.log
          if-no-files-found: error
          retention-days: 1
