name: Release blog AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/blog-ai/**"
      - ".github/workflows/worker-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ai-worker-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test blog AI Worker
        run: node --test workers/blog-ai/src/*.test.js

      - name: Deploy blog AI Worker
        run: npx --yes wrangler@latest deploy --config workers/blog-ai/wrangler.jsonc

      - name: Verify analytics range endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://thinkerqaq-blog-ai.blog-ai.workers.dev"
          health="$(mktemp)"
          hour="$(mktemp)"
          day="$(mktemp)"
          week="$(mktemp)"
          trap 'rm -f "$health" "$hour" "$day" "$week"' EXIT

          verify() {
            curl --fail --silent --show-error --retry 3 "$base/analytics/health" > "$health" || return 1
            curl --fail --silent --show-error --retry 3 "$base/analytics/hour-range" > "$hour" || return 1
            curl --fail --silent --show-error --retry 3 "$base/analytics/day-range" > "$day" || return 1
            curl --fail --silent --show-error --retry 3 "$base/analytics/weekly-range" > "$week" || return 1

            node - "$health" "$hour" "$day" "$week" <<'NODE'
          const fs = require("fs");
          const [health, hour, day, week] = process.argv.slice(2)
            .map(path => JSON.parse(fs.readFileSync(path, "utf8")));
          if (health.healthy !== true || health.pendingHours !== 0 || health.hasError) {
            throw new Error("Unhealthy Worker analytics: " + JSON.stringify(health));
          }
          for (const [label, report] of [["hour", hour], ["day", day], ["week", week]]) {
            if (report.granularity !== label || !report.range || !report.window?.stats) {
              throw new Error("Invalid " + label + " range response: " + JSON.stringify(report));
            }
            if (report.window.regions !== undefined || report.window.cities !== undefined) {
              throw new Error(label + " range leaks private geographic dimensions");
            }
          }
          console.log(
            "analytics healthy; hour=" + hour.window.stats.pageviews +
            " PV; day=" + day.window.stats.pageviews +
            " PV; week=" + week.window.stats.pageviews + " PV",
          );
          NODE
          }

          for attempt in 1 2 3 4 5 6; do
            if verify; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::error::Analytics range verification failed after deployment"
          exit 1
