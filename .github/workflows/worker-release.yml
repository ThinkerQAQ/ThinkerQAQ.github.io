name: Release blog AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/blog-ai/**"
      - ".github/workflows/worker-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ai-worker-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test blog AI Worker
        run: node --test workers/blog-ai/src/*.test.js

      - name: Deploy blog AI Worker
        run: npx --yes wrangler@latest deploy --config workers/blog-ai/wrangler.jsonc

      - name: Verify analytics endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://thinkerqaq-blog-ai.blog-ai.workers.dev"
          health="$(mktemp)"
          hourly="$(mktemp)"
          today="$(mktemp)"

          verify() {
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-connrefused "$base/analytics/health" > "$health" || return 1
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-connrefused "$base/analytics/hourly" > "$hourly" || return 1
            curl --fail --silent --show-error --retry 3 --retry-delay 1 --retry-connrefused "$base/analytics/today" > "$today" || return 1

            node - "$health" "$hourly" "$today" <<'NODE'
          const fs = require("fs");
          const [healthPath, hourlyPath, todayPath] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthPath, "utf8"));
          const hourly = JSON.parse(fs.readFileSync(hourlyPath, "utf8"));
          const today = JSON.parse(fs.readFileSync(todayPath, "utf8"));

          if (health.healthy !== true || !health.lastSuccessAt || health.pendingHours !== 0 || health.hasError === true) {
            throw new Error(`analytics health check failed: ${JSON.stringify(health)}`);
          }
          if (!hourly.generatedAt || !hourly.current?.stats || !hourly.previous?.stats) {
            throw new Error("analytics/hourly is missing persisted current/previous windows");
          }
          if (!today.generatedAt || !today.date || !today.current?.stats) {
            throw new Error("analytics/today is missing the current-day aggregate");
          }

          const forbidden = [
            ["health.websiteId", health.websiteId],
            ["health.lastError", health.lastError],
            ["health.lastFinalizedHourEnd", health.lastFinalizedHourEnd],
            ["health.lastScheduledAt", health.lastScheduledAt],
            ["hourly.websiteId", hourly.websiteId],
            ["hourly.current.regions", hourly.current?.regions],
            ["hourly.current.cities", hourly.current?.cities],
            ["hourly.previous.regions", hourly.previous?.regions],
            ["hourly.previous.cities", hourly.previous?.cities],
            ["today.websiteId", today.websiteId],
            ["today.generatedAtMs", today.generatedAtMs],
            ["today.current.regions", today.current?.regions],
            ["today.current.cities", today.current?.cities],
          ].filter(([, value]) => value !== undefined);

          if (forbidden.length) {
            throw new Error(`analytics public response exposes forbidden fields: ${forbidden.map(([name]) => name).join(", ")}`);
          }

          console.log(
            `analytics healthy; hourly=${hourly.current.stats.visitors} visitors/${hourly.current.stats.pageviews} pageviews; today=${today.current.stats.visitors} visitors/${today.current.stats.pageviews} pageviews`,
          );
          NODE
          }

          for attempt in 1 2 3 4 5 6; do
            echo "Analytics verification attempt $attempt/6"
            if verify; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Worker version may still be propagating; retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "::error::Analytics endpoint verification did not converge after Worker deployment."
          exit 1
