name: Release blog AI Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/blog-ai/**"
      - ".github/workflows/worker-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ai-worker-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_SEARCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test blog AI Worker
        run: node --test workers/blog-ai/src/*.test.js

      - name: Deploy blog AI Worker
        run: npx --yes wrangler@latest deploy --config workers/blog-ai/wrangler.jsonc

      - name: Verify analytics endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://thinkerqaq-blog-ai.blog-ai.workers.dev"
          health="$(mktemp)"
          hourly="$(mktemp)"
          today="$(mktemp)"

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$base/analytics/health" > "$health"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$base/analytics/hourly" > "$hourly"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "$base/analytics/today" > "$today"

          node - "$health" "$hourly" "$today" <<'NODE'
          const fs = require("fs");
          const [healthPath, hourlyPath, todayPath] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthPath, "utf8"));
          const hourly = JSON.parse(fs.readFileSync(hourlyPath, "utf8"));
          const today = JSON.parse(fs.readFileSync(todayPath, "utf8"));

          if (health.healthy !== true || !health.lastSuccessAt || health.pendingHours !== 0 || health.lastError) {
            throw new Error(`analytics health check failed: ${JSON.stringify(health)}`);
          }
          if (!hourly.generatedAt || !hourly.current?.stats || !hourly.previous?.stats) {
            throw new Error("analytics/hourly is missing persisted current/previous windows");
          }
          if (!today.generatedAt || !today.date || !today.current?.stats) {
            throw new Error("analytics/today is missing the current-day aggregate");
          }

          console.log(
            `analytics healthy; hourly=${hourly.current.stats.visitors} visitors/${hourly.current.stats.pageviews} pageviews; today=${today.current.stats.visitors} visitors/${today.current.stats.pageviews} pageviews`,
          );
          NODE
