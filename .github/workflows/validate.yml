name: Validate

on:
  push:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEVTOOL_VERSION: dfe9e80518606bd6d4d121f43ed9155bd464b739
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install DevTool V2
        run: |
          GOPROXY=direct go install github.com/thinkerqaq/devtool/cmd/devtool@${DEVTOOL_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate DevTool configuration
        run: devtool config validate

      - name: Inspect BlogCTL project extension
        run: devtool project inspect --json

      - name: Verify BlogCTL
        run: devtool verify

      - name: Build BlogCTL
        run: devtool build

      - name: Package BlogCTL
        run: devtool package

      - name: Verify DevTool artifacts
        run: |
          test -s .devtool/out/blogctl
          test -s .devtool/artifacts/blogctl-release/SHA256SUMS
