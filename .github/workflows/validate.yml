name: Validate site deployment wrapper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Validate site overlay and site identity
        run: |
          node --test scripts/prepare-inkerio-deployment.test.mjs scripts/prepare-search-notify.test.mjs scripts/prepare-edgeone-redirects.test.mjs
          test ! -e tools/blogctl && test ! -e go.work
          node -e 'const c=require("./site.config.json"); if (!c.url.startsWith("https://") || !c.commentsRepository) process.exit(1)'

      - name: Test production Worker contracts
        run: |
          node --test workers/blog-ai/src/*.test.js
          node --test workers/blog-reactions/src/index.test.js
