name: Validate

on:
  push:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: tools/blogctl/go.sum

      - name: Test analytics Worker contracts
        run: node --test workers/blog-ai/src/*.test.js

      - name: Verify BlogCTL
        run: go run ./tools/blogctl/cmd/maint verify

      - name: Build BlogCTL
        run: go run ./tools/blogctl/cmd/maint build

      - name: Collect redistributable third-party license texts
        run: |
          mkdir -p .build/tools
          GOTOOLCHAIN="$(go env GOVERSION)" GOBIN="$PWD/.build/tools" go install github.com/google/go-licenses/v2@v2.0.1
          rm -rf .build/out/publish-licenses
          CGO_ENABLED=0 .build/tools/go-licenses save ./tools/blogctl/cmd --ignore=github.com/ThinkerQAQ/ThinkerQAQ.github.io/tools/blogctl --save_path="$PWD/.build/out/publish-licenses"

      - name: Package BlogCTL
        run: go run ./tools/blogctl/cmd/maint package

      - name: Verify release artifacts
        run: |
          test -s .build/out/blogctl
          test -s .build/artifacts/blogctl-release/SHA256SUMS
          (cd .build/artifacts/blogctl-release && sha256sum -c SHA256SUMS)
