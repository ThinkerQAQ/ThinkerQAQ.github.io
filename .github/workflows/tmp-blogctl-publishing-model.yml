name: Temporary BlogCTL publishing model

on:
  push:
    branches:
      - refactor/blogctl-content-workspace

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/blogctl-content-workspace
      - name: Update Bridge publishing API model
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/blogctl/bridge/control.go')
          text = path.read_text()

          type_start = text.find('type publishingPlatformView struct {')
          type_end_marker = '\n}\n\nfunc readFrontmatterScalar'
          type_end = text.find(type_end_marker, type_start)
          if type_start < 0 or type_end < 0:
              raise SystemExit('publishing view type boundaries not found')
          new_type = '''type publishingPlatformView struct {
          \tID        string                    `json:"id"`
          \tLabel     string                    `json:"label"`
          \tFooter    publishingFooterConfig    `json:"footer"`
          \tCanonical publishingCanonicalConfig `json:"canonical"`
          \tTracking  publishingTrackingConfig  `json:"tracking"`
          }'''.replace('          ', '')
          text = text[:type_start] + new_type + text[type_end + 2:]

          start = text.find('func publishingViews(config bridgeConfig) []publishingPlatformView {')
          end = text.find('func normalizeSyncRequest(', start)
          if start < 0 or end < 0:
              raise SystemExit('publishing functions block not found')
          replacement = '''func publishingViews(config bridgeConfig) []publishingPlatformView {
          \tviews := make([]publishingPlatformView, 0, len(publishingPlatformOrder))
          \tfor _, id := range publishingPlatformOrder {
          \t\tvalue := config.Publishing.Platforms[id]
          \t\tviews = append(views, publishingPlatformView{
          \t\t\tID: id, Label: platformLabels[id], Footer: value.Footer,
          \t\t\tCanonical: value.Canonical, Tracking: value.Tracking,
          \t\t})
          \t}
          \treturn views
          }

          func updatePublishing(config bridgeConfig, views []publishingPlatformView) (bridgeConfig, error) {
          \tif config.Publishing.Platforms == nil {
          \t\tconfig.Publishing = defaultPublishingConfig()
          \t}
          \tfor _, view := range views {
          \t\tif _, ok := supportedSyncPlatforms[view.ID]; !ok {
          \t\t\treturn config, fmt.Errorf("unsupported publishing platform: %s", view.ID)
          \t\t}
          \t\tconfig.Publishing.Platforms[view.ID] = publishingPlatformConfig{
          \t\t\tFooter: view.Footer, Canonical: view.Canonical, Tracking: view.Tracking,
          \t\t}
          \t}
          \treturn normalizeBridgeConfig(config)
          }

          '''.replace('          ', '')
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
      - name: Add legacy migration coverage
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/blogctl/bridge/config_test.go')
          text = path.read_text()
          if '"strings"' not in text:
              text = text.replace('\t"reflect"\n', '\t"reflect"\n\t"strings"\n', 1)
          addition = r'''

          func TestBridgeConfigMigratesLegacyPublishingProfiles(t *testing.T) {
          	dir := t.TempDir()
          	t.Setenv("BLOGCTL_CONFIG_DIR", dir)
          	legacy := `{
          	  "publishing": {
          	    "cnblogs": {
          	      "footerEnabled": true,
          	      "footerTemplate": "legacy {url}",
          	      "trackingQuery": "utm_source=legacy-cnblogs&utm_medium=referral&utm_campaign=legacy"
          	    }
          	  }
          	}`
          	if err := os.WriteFile(filepath.Join(dir, "config.json"), []byte(legacy), 0o600); err != nil {
          		t.Fatal(err)
          	}
          	config := loadBridgeConfig()
          	profile := config.Publishing.Platforms["cnblogs"]
          	if !profile.Footer.Enabled || profile.Footer.Template != "legacy {url}" {
          		t.Fatalf("footer = %#v", profile.Footer)
          	}
          	if profile.Canonical.Mode != "footer" {
          		t.Fatalf("canonical = %#v", profile.Canonical)
          	}
          	if !profile.Tracking.Enabled || profile.Tracking.Source != "legacy-cnblogs" || profile.Tracking.Campaign != "legacy" {
          		t.Fatalf("tracking = %#v", profile.Tracking)
          	}
          	if err := saveBridgeConfig(config); err != nil {
          		t.Fatal(err)
          	}
          	data, err := os.ReadFile(filepath.Join(dir, "config.json"))
          	if err != nil {
          		t.Fatal(err)
          	}
          	if !strings.Contains(string(data), `"platforms"`) || strings.Contains(string(data), `"trackingQuery"`) {
          		t.Fatalf("migrated config = %s", data)
          	}
          }
          '''.replace('          ', '')
          if 'TestBridgeConfigMigratesLegacyPublishingProfiles' not in text:
              text += addition
          path.write_text(text)
      - name: Format and test BlogCTL
        shell: bash
        run: |
          gofmt -w tools/blogctl
          cd tools/blogctl
          go test ./...
      - name: Commit publishing model
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blogctl/bridge
          git commit -m "refactor: introduce structured publishing profiles"
          git push origin HEAD:refactor/blogctl-content-workspace
