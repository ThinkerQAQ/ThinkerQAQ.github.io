<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlogCTL</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="brand-row">
          <h1>BlogCTL <span id="version"></span></h1>
          <strong id="bridgeIndicator" class="status checking">Bridge 检测中</strong>
        </div>
        <p>博客同步发布控制面</p>
      </div>
      <button id="refresh" class="secondary compact" type="button">刷新</button>
    </header>

    <nav class="tabs" role="tablist" aria-label="BlogCTL">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="sync">同步发布</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="publishing">发布配置</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="environment">工具与配置</button>
    </nav>

    <section class="panel active" role="tabpanel" data-panel="sync">
      <div class="status-card">
        <div class="section-title">同步发布</div>
        <p class="card-hint">正在接入 Article Registry 与 Sync Job。</p>
      </div>
    </section>

    <section class="panel" role="tabpanel" data-panel="publishing">
      <div class="status-card">
        <div class="section-title">发布配置</div>
        <p class="card-hint">正在接入平台 Footer 与 Tracking 配置。</p>
      </div>
    </section>

    <section class="panel" role="tabpanel" data-panel="environment">
      <section class="status-card">
        <div class="status-row">
          <span>BlogCTL Bridge</span>
          <strong id="bridgeStatus" class="status checking">检测中</strong>
        </div>
      </section>

      <section class="status-card proxy-card">
        <div class="status-row">
          <span class="section-title proxy-title">网络代理</span>
          <strong id="proxyStatus" class="status checking">检测中</strong>
        </div>
        <label class="switch-row" for="proxyEnabled">
          <span>
            <strong>启用代理</strong>
            <small>只影响 Bridge 发起的外网请求；本机控制通信保持直连。</small>
          </span>
          <input id="proxyEnabled" type="checkbox" disabled>
        </label>
        <div class="proxy-fields">
          <label>
            <span>代理主机</span>
            <input id="proxyHost" type="text" placeholder="127.0.0.1" autocomplete="off" disabled>
          </label>
          <label>
            <span>代理端口</span>
            <input id="proxyPort" type="number" min="1" max="65535" placeholder="7890" autocomplete="off" disabled>
          </label>
        </div>
        <button id="saveProxy" class="secondary full-width" type="button" disabled>保存代理设置</button>
        <p id="proxyHint" class="card-hint">配置保存到本机 BlogCTL。</p>
      </section>

      <section class="status-card">
        <div class="section-title">平台登录状态</div>
        <div id="platformStatuses" class="platform-statuses">
          <div class="platform-loading">正在检测平台登录状态…</div>
        </div>
      </section>

      <section class="status-card session-card">
        <div class="status-row">
          <span>Medium Session</span>
          <strong id="mediumSessionStatus" class="status checking">检测中</strong>
        </div>
        <button id="syncMediumSession" class="secondary full-width" type="button" disabled>同步 Medium Session</button>
      </section>

      <p id="environmentMessage" class="message" role="status"></p>
    </section>
  </main>

  <script src="core.js"></script>
  <script src="sync.js"></script>
  <script src="publishing.js"></script>
  <script src="environment.js"></script>
  <script src="popup.js"></script>
</body>
</html>
